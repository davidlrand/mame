density_source:   # cont.443 - density is UIB+$12 BIT 2.  Two earlier answers here were wrong.
  ANSWER: >
    Density is UIB+$12 bit2.  Measured against the media, which is mixed (cyl 0 FM 16x128, cyl 1+
    MFM 16x256), from the UIB the gate array itself fetches from host $0FE948 per operation:
      cyl  0  UIB+12=$40  bit1=0 bit2=0   media FM    (host block: 02 10 80 00 07 07 ... 40 18)
      cyl  1  UIB+12=$44  bit1=0 bit2=1   media MFM   (host block: 02 10 00 01 0d 0d ... 44 20)
      cyl 69  UIB+12=$37  bit1=1 bit2=1   media MFM
      cyl 83  UIB+12=$2f  bit1=1 bit2=1   media MFM
    Byte 3 of the fetched block is the cylinder (00 then 01), so the first two are unambiguously the
    cyl-0 and cyl-1 reads.  bit2 tracks the media EXACTLY; bit1 does not.
    Not a firmware-RAM snoop: the UIB is a HOST-SUPPLIED control block the gate array DMAs in itself.
  ★ TWO WRONG ANSWERS BEFORE IT, and the second is the instructive one: >
    cont.439 took density from E800 bit10 - the firmware never sets it for this purpose.  Correctly
    rejected.
    cont.441 then took it from the field program's bit7 and called it CONFIRMED on five samples of
    "program bit7 == UIB+$12 bit1".  That correlated two signals against EACH OTHER and never against
    the media.  They agreed perfectly while both were wrong at cylinder 1, where bit1 is clear on an
    MFM track.  A self-consistent loop that never touched ground truth.
    LESSON, distinct from the measurement-flaw classes already on file: a correlation between two
    derived signals is not confirmation.  Anchor to the MEDIA (or whatever the external truth is),
    not to another part of the same system.
  RESULT: >
    Every capture is now correct - FM 16x128 at cyl 0, MFM 16x256 at cyl 1 and beyond - and the
    cylinder-1 read no longer errors (the "READ -compl-stat: 42 sensb: 12" line is gone).
  MFM FRONTIER, corrected and localised (cont.444): >
    CORRECTION to "the chunk pointer never advances": it DOES.  Measured [$741e] walking
    2000 -> 2080 -> 20c0 -> 2100 -> 2180 -> 21c0 -> 2200 with the free list [$74ac] following
    74cc -> 74dc -> 74e4 -> 74ec, and $7EE0 IS reached per record while $32AC returns varying
    indices.  Both of the two candidate causes are eliminated.
    The failure is one step later: [$741e] is the FIRMWARE's pointer; the gate array's arm is
    C800[0], and that stays at $2380 (chunk $4700) while [$741e] moves.  The firmware advances
    internally and does not re-arm the gate array.
    THE RE-ARM AND ITS GATE (verified from the disassembly):
      $92B8 tst.w $742c / $92BC bne $92F6        <- gate: non-zero SKIPS the re-arm
      $92BE move.w $7434,$d800
      $92C4 move.w $741e,$c800                   <- the ONLY copy of [$741e] into the GA arm
    [$742C] - FULL enumeration, uncapped (an earlier `head -6` truncated this and lost two setters
    and two testers; see guardrails - never cap a writer enumeration):
      setters (5):  $7162  $7BF6  $7EA4  $7EB2  $95DA
      clearers (3): $7CA8  $7E42  $7E90
      testers (3):  $925E  $92AC  $92B8
    $7EB2 is THE one that matters here: it is reached by $7E8E beq $7EB2, the [$7968]==0 leg - the
    leg that runs on the MFM path - so it is the setter the latch depends on.  A truncated list that
    omitted it described a gate with no path to latch on the failing case.
    Note also that [$742C] gates THREE sites in this region ($925E, $92AC, $92B8), not just the
    re-arm, so it blocks more than the C800 copy.
    HYPOTHESIS with a matching symptom: with [$7968]==0 and nothing being rejected, [$742C] latches
    at 1 after the first record and every subsequent $92B4 bails, freezing C800[0] while [$741e]
    walks on.  FM never showed this because the rotational start produces rejects, and each reject
    clears [$742C] through $7CA8.
    GATE HYPOTHESIS REFUTED cont.445 - $92B8 is NEVER REACHED:
      $92B8 tests: 0 | skipped (742C non-zero): 0 | $92C4 re-arms: 0
      setters fired:  $7EB2=16  $7EA4=1
      clearers fired: $7E90=17  $7CA8=2
    [$742C] is not latching - it toggles freely, set 17 times and cleared 19.  The reason C800[0]
    stays frozen at $2380 is more fundamental: THE RE-ARM ROUTINE AT $92B4 IS NEVER ENTERED.  Nothing
    gates it off; nothing calls it.
    Confirmed in passing: $7EB2 fires exactly 16 times, so all 16 MFM records take the [$7968]==0 leg
    as predicted.  ($7E90's count of 17 is prefetch-inflated - $7E8E beq $7EB2 makes $7E90 the
    fall-through - so only $7EB2, a branch TARGET, is trustworthy here.)
    THE ARM IS A REPLICATED IDIOM, not a shared routine (cont.446): `move.w $741e.w,$c800.w` appears
    at TWELVE sites - 28f4 2920 293c 7fd0 7fee 8022 86a2 86f6 8754 926c 9284 92c4 - and
    `move.w $7434.w,$d800.w` at thirteen.  Each path carries its own copy.  So $92C4 was never "the
    only copy", and $92B4 is not a called routine despite its movem.l: its ONLY predecessor is
    $2996 bra $92b4.
    COUNTED ALL TWELVE, FM vs MFM (no inference):
      $7FEE   FM 0   MFM 1
      $8022   FM 12  MFM 4     <- the per-record arm, in the $801C/$8022 data-done handler
      $9284   FM 0   MFM 1
      $92C4   FM 0   MFM 0     (silent - independently confirms the cont.445 refutation)
      the other eight: silent in both
    So the arm is NOT absent on MFM - it UNDER-FIRES.  $8022 runs 4 times for 16 records against 12
    on FM, and only ~4 transfers reach the host.  Twelve of sixteen MFM records never reach the
    data-done handler at all.
    TRANSFER LENGTH (cont.447) - a latent fragility, NOT the cause of the drop pattern:
      The length came from `m_track[0].len` - sector INDEX 0 of the LAST capture, not the sector in
      flight and not any commanded count, with a comment baking in "one FM sector".  Predicted
      symptom was 128-byte transfers of 256-byte MFM sectors.  MEASURED AND REFUTED:
        FM  read: len=128  track[0]=128  track[m_sec_index]=128  [$7996]=$0080
        MFM read: len=256  track[0]=256  track[m_sec_index]=256  [$7996]=$0100
      All agree, so transfers are full-length and this is NOT what drops the MFM records.  It was
      right only by coincidence - a track is re-captured per operation and every sector on it shares
      a size - and breaks on a mixed-size track or a stale capture.
      FIXED on its own terms: length now taken from m_track[m_sec_index], the sector actually in
      flight, which is the gate array's own decode.  ([$7996] carries the firmware's commanded size,
      $0080 FM / $0100 MFM, but it is firmware RAM; [$7460] is a constant $0011 and is not a byte
      count.)  Verified no regression: FM 128, MFM 256, label still readable at the host.
    FRONTIER (unchanged): why 12 of 16 MFM records are dropped BEFORE data-done - which points at the record
    verify / MFM ID compare ($89F2, $9884), the code this campaign long recorded as unreachable.
    CAVEAT on the instrument: the FM/MFM labelling read UIB+$12 ($6E72) from inside a tap callback,
    within the model's own $4000-$7FFF snoop range - the hazard in storager-measurement-discipline.
    The split is coherent and $92C4=0 matches an independent run, but re-take with the density
    latched in the periodic before relying on the exact 4-vs-16 ratio.
    NOT A LEAD - the failed allocations' "garbage indices": $3474/$347A write (-$6,A3) and (-$8,A3)
    TOGETHER on the success path only, so when the verdict is 0000 the index slot was never written
    and holds stale frame contents.  $74c4/$6ed6/$6b44/$71f0 being RAM addresses is exactly that.
    Not a defect; recorded so it is not chased.
    So the MFM frontier is back on [$7968] - the cell that dominated the earlier campaign, now
    reached by a different route.
  superseded_NEW_FRONTIER - the MFM RECORD path: >
    The verdict is still "no sys-floppy", now for a different reason: on the MFM read the firmware
    never advances the chunk pointer.  All 16 fields land in chunk $4700 and only ~4 transfers reach
    the host.  The capture is right (c=01 h=00, r=01..10, 256 bytes); the per-record handling stalls.
    That is the firmware's MFM branch - $89F2's A1/A1/A1/FE verify and $9884's MFM ID compare -
    running for the FIRST time.  This campaign recorded those as "legitimately unreachable, do not try
    to make them run"; they are reachable now.

superseded_density_source:   # cont.439 - density comes from the field program, not E800 bit10
  finding: >
    The model took density from E800 bit10 (flux_density_fm = !BIT(m_ch[E800],10)).  The firmware
    NEVER sets that bit for this purpose - measured: set once during the boot self-test at t=0.20,
    cleared at t=0.51, never again.  Meanwhile cont.428 established that op18's field program
    describes the TRACK FORMAT (which is also why it is count-invariant), and two distinct programs
    are observed that separate perfectly:
      0a6d 0829 0033 0a6d 0a09 ... 023f    bit7 clear 16/16
      02ad 0aad 08a9 00b3 06ad ... 0cbb    bit7 set   16/16
    Density is now taken from BIT(m_prog[0], 7), falling back to E800 bit10 before any program loads.
  CONFIRMED cont.441 - program bit7 IS density, and it tracks the firmware's own flag: >
    Five samples, program bit7 against UIB+$12 bit1, correlating exactly:
      cyl  0  media FM   bit7 0/16   UIB+12=40  bit1=0
      cyl  0  media FM   bit7 0/16   UIB+12=40  bit1=0
      cyl  1  media MFM  bit7 0/16   UIB+12=44  bit1=0    <- firmware commands FM on an MFM track
      cyl 69  media MFM  bit7 16/16  UIB+12=37  bit1=1
      cyl 83  media MFM  bit7 16/16  UIB+12=2f  bit1=1
    So the field program carries density, derived from the firmware's own density flag - and taking it
    from the PROGRAM stays the correct source (it is what the gate array is told) while now having
    evidence behind it, not only doctrine.
  CAVEAT 1 RETIRED - the data DID distinguish the bit: >
    The bit sweep at cont.439 already showed bit 6 at 2/16 vs 0/16 and bit 11 at 11/16 vs 13/16 -
    NEITHER consistent.  Bit 7 is the ONLY bit clear in all sixteen words of one program and set in
    all sixteen of the other.  The "underdetermined between 11/7/6" caveat was accepted despite the
    measurement already contradicting it; recorded here so it is not reinstated.
  CAVEAT 2 WEAKENED: $02ad is now also observed at cyl 83, and both its occurrences carry
    UIB+$12 bit1=1, so it is no longer only a post-failure artefact.
  ★ THE CYLINDER-1 ANOMALY, isolated: >
    For the read at cylinder 1 - MFM by construction, and per Dave the firmware KNOWS track 1+ is MFM
    from its format tables - the firmware commands UIB+$12 = $44: bit1 CLEAR (FM density) but bit2 SET
    (the MFM header-compare enable, $3566/$3570).  Half-set: MFM comparison logic on, MFM density off.
    Compare cyl 0's $40 (bit6 only) and cyl 69's $37 / cyl 83's $2f (both bit1 set).
    There is NO retry path - the firmware does not discover the format - so this is not FM-first
    probing.
    TRACED cont.441b - the density flag is HOST-SUPPLIED, not firmware-computed:
      NO ROM site can set UIB+$12 bit1.  The only +$12 writers are $2406 (move.w D0, and D0 is #$0
      from $23F2), $3AC4 and $3D10 (both move.w #$1), and $3570 (ori.b #$4).
      Measured writers of $6E72 during the reads: pc=$3D4A, the CONTROL-BLOCK DMA path -
        6.4086  UIB+12 <= 40 / +13 <= 18   bit1=0
        8.1218  UIB+12 <= 44 / +13 <= 20   bit1=0
        8.1326  UIB+12 <= 40 / +13 <= 18   bit1=0
      So the CPUAP supplies the density, and for these reads it supplies FM.
    THE CONTRADICTION, unresolved: the firmware's own console reports the failing read as
      "Cyld = 1 Head = 0 Sect = 1, Log. Blocknr = 33" - block 33 IS cylinder 1, MFM by construction -
      while the host-supplied UIB for that operation says FM.  Both sides are known-good.
    THREE READINGS, not distinguished by anything measured:
      1. the model fetches the UIB from the wrong host address/offset, so bit1 is real but the wrong
         byte is being read;
      2. density is updated per-operation by a path that runs AFTER the DMA and the model breaks it;
      3. REFUTED cont.442.  Compared the firmware's expected cylinder [$7438] and head [$7436]
         against the drive's actual position at every capture:
           cyl 0 read   wants 0/0  drive 0/0    MATCH
           cyl 0 read   wants 0/0  drive 0/0    MATCH
           cyl 1 read   wants 1/0  drive 1/0    MATCH    <- the FAILING read: seek is CORRECT
           later        wants 0/0  drive 69/0   mismatch
           later        wants 0/0  drive 83/0   mismatch
         The head is exactly where the operation targets for the failing read.  The mismatches occur
         only AFTER it, while recovering toward cylinder 0 - the runaway is a CONSEQUENCE, not the
         cause.
    SO THE CHARACTERISATION IS NOW EXACT AND HAS NO ESCAPE HATCH: correct target, correct head
    position, correct record layout, correct payload byte order - and the firmware commands FM
    density for a track that is MFM by construction.  Readings 1 and 2 survive.
    Against reading 1: node+$12 was $0f (bit1 SET = MFM) at EVERY program load measured, including
    the cyl-0 FM reads, so the node's density bit is constant across FM and MFM operations and cannot
    be the discriminator.  If the model is reading the wrong field, node+$12 is not the right one.
  CAVEAT 1 as originally recorded (superseded above) - UNDERDETERMINED: >
    0a6d ^ 02ad = $08C0, so bits 11, 7 and 6 ALL separate the two programs, and with only two samples
    each would test equally clean.  Bit 7 is PROVISIONAL; the data does not distinguish it from 11
    or 6.  Do not record it as decoded.
  CAVEAT 2 - WEAK PROVENANCE for the MFM sample: >
    $02ad is only ever observed at cylinder 69, i.e. AFTER a seek has already gone wrong.  It is the
    only second program seen and it separates cleanly, but "$02ad is the MFM program" is inferred
    from a post-failure state.
  NOT taken from UIB+$12 bit1 - and this reasoning is on file so the shortcut is not re-taken: >
    UIB+$12 bit1 is the firmware's own decoded density flag ($8AE4/$7366/$9456/$6536/$7C5C, all
    consistent) and would be a ONE-LINE fix.  It is also a firmware-RAM snoop, the shape the LLE
    mandate rules out and that this campaign has spent months removing.  The field program is what
    the gate array is actually TOLD, so it is the correct source even while its semantics are
    undecoded.
  MFM DECODER FIXED cont.440, and the density bit CONFIRMED from the second direction: >
    Root cause: capture_track stored a data field WITHOUT requiring its own ID field to have preceded
    it.  The sweep starts at an arbitrary rotational position, so it can begin mid-sector and meet a
    data field whose ID already passed the head; that was stored carrying the STALE id[] (r=00) and
    the stale size code (128 << 0 = 128 instead of 256).  Gated on a have_id flag, set when an ID is
    recovered and cleared when its data field is consumed.
    Invisible for the whole campaign because only FM was ever exercised, and the FM sweeps happened
    to begin on an ID.
    RESULT  cyl 69 (a known 16x256 MFM track): 17 sectors / first r=00 len=128  ->  16 sectors /
    256 bytes / r=04..r=03 (rotational wrap, correct for an arbitrary start).
    CONTENT VERIFIED, not merely structure: decoded R=1 first8 = 000000907c4e18a6, byte-exact against
    the IMD.  FM unchanged at 16x128 - no regression.
    This also CONFIRMS the density bit from the second direction, the test that was inconclusive at
    cont.439: with a working MFM decoder, BIT(m_prog[0],7) selects a decode that yields a valid track.
    The bit does real work.  Its two caveats stand - still underdetermined between bits 11/7/6, and
    $02ad's provenance is still a post-failure state.
  TEST RESULT at cont.439 - inconclusive, superseded by the above: >
    The switch WORKS: density now follows the program (FM at cyl 0/1, MFM at cyl 69).
    The confirmation FAILS: cylinder 69 is definitively a 300k MFM 16x256 track (IMD: cyls 0..79,
    160 tracks, cyl 0 both heads FM 16x128, cyl 1..79 MFM 16x256), and the model decodes it as
    17 sectors with first r=00 len=128 and last r=03 len=256 - garbage, with sector IDs starting at
    0 where the media has 1..16.
    So the encoding is NOT confirmed from the second direction.  What the change exposed instead is
    that capture_track's MFM DECODE PATH IS BROKEN - invisible until now because the MFM branch had
    never run.
  the_cylinder1_question_is_separate: >
    At cyl 1 (MFM media) the firmware loads the SAME program as at cyl 0 (FM).  That is a claim about
    the firmware's DECISION, not about what the program encodes.  Plausibly it tries FM first on a
    mixed-density disk and is supposed to retry as MFM; the seek then runs away to cyl 69 instead.
    Whether an FM-fails-retry-MFM path exists, and whether the runaway is what happens when it does
    not, is its own investigation and is not blocked by the density source either way.
  conf: "V (E800 bit10 is not the source; the switch works) / ? (which bit; whether $02ad is MFM)"

floppy_boot_status:   # cont.436 - the fundamental question, answered
  ANSWER: >
    NO.  pcmx2 does not boot to a usable state from floppy.  Measured on the 97801 console
    (docs/storager-lle/fboot120.lua, 120s run, -flop siemens/set1/mx2-001.imd, no hard disk):
      @6.4  testend
      @8.3  no sys-floppy, going to harddisk
      @63.1 READ -compl-stat: 42 sensb: 29 ... sasiopen: no label SINIX found
      @63+  waiting for harddisk ready   (loops indefinitely)
    The firmware does not recognise the mounted disk as a system floppy, at 8.3s.
  THE FAILURE IS UPSTREAM OF THE WHOLE COMPLETION CAMPAIGN: >
    The storager's reads COMPLETE in that window - the 87/89/95 preamble at 6.40-6.41 posts 0x80 -
    and the disk is still rejected.  None of the twelve commits of cont.426-435 bear on this.
  ★ RETRACTED cont.438 - "payload byte order verified correct" was WORTHLESS: >
    The cont.436 check read `cs.read_byte(ld + k)` - the storager's OWN RAM - and did so BEFORE the
    copy loop.  It never touched the transform, so it could not have tested the swap.  Read past the
    wire (`bs.read_byte(m_c000 + k)`, AFTER the copy) the host was receiving:
      local "VOL1SINIX0"  ->  host "OV1LISIN0X"
      local "HDR1 NSC Boot" -> host "DH1RN CSB oo t"
    ALWAYS take an acceptance test on the far side of the transform being tested.
  ★★ FAILURE OF THE RECORD, not of the reasoning - the first correct prior this campaign walked past: >
    cont.406 ALREADY recorded, in this file, that the label buffer base is ODD ($0FC0DD) and that no
    word-boundary swap can serve it, naming "OV1LISIN0X" as the signature of getting it wrong.
    cont.426 inverted the data arm (swap = is_data ? 1 : 0) without answering that argument, and the
    exact predicted signature came back.
    LESSON: an entry that ARGUES AGAINST a change must be ANSWERED, not merely superseded.  This is
    distinct from the measurement-flaw classes - the prior was correct, on file, and readable.
    Also wrong in FORM: `m_c000 + (k ^ 1)` pairs bytes across the base, not within host words, and the
    base is odd - so it transposed across the odd boundary.  Removed rather than corrected.
  FIX cont.438 - swap = 0 EVERYWHERE, the compensation is gone: >
    The SRAM byte-order correction (cont.426) SUBSUMES it.  Control blocks were already at 0 and
    verified working (0x80 reaches host+3, the host accepts commands); data needs 0 too.  Both arms
    zero, so the ternary is deleted rather than left always-yielding-zero.
    VERIFIED PAST THE TRANSFORM: host $0FC3DD reads "VOL1SINIX0"; 11 clean 0x80 completions.
    BEHAVIOURAL CHANGE - the label check now PASSES:
      before: @8.3 no sys-floppy, going to harddisk
      after:  @8.4 READ -compl-stat: 42 sensb: 12, Cyld = 1 Head= 0 Sect = 1, Log. Blocknr = 33
              then no sys-floppy
    The firmware accepts the label and proceeds to CYLINDER 1, which it never reached before.  The
    failure moved from data integrity to a multi-track/seek read failure on cyl 1.
  VERIFIED GOOD (the layout half only - the payload half is retracted above): >
    1. DATA PAYLOAD BYTE ORDER.  The host receives "VOL1SINIX0" and "HDR1 NSC Boot" reading
       correctly, not scrambled - so the cont.426 data-field swap inversion (swap = is_data ? 1 : 0)
       is CORRECT.  This was flagged unchecked since cont.426 and is now checked.
    2. CAPTURE RECORD LAYOUT, both densities.  Read from the firmware's own POSPTRs (UIB+$C8/$CA/
       $CC/$CE, absolute addresses, written by $2CF2's density-driven init):
         FM  : C=$7DAD H=$7DAE S=$7DAF X=$7DBA   = +1/+2/+3/+14 from $7DAC
         MFM : C=$7DB0 H=$7DB1 S=$7DB2 X=$7DC0   = +4/+5/+6/+20
       The model writes FE,C,H,R,N (FM) and A1,A1,A1,FE,C,H,R,N (MFM), so R lands at +3 and +6
       respectively.  BOTH MATCH.  No clobber: UIB+$CE never holds anything but those two values.
  STORAGER EXONERATED FOR THIS REJECTION (cont.437): >
    Sectors are placed BY IDENTITY and correctly - pos = r-1 - verified three independent ways:
      the IOCB requests 8 blocks from the start into host buffer $0FC0DD (95 00 00 00 02 00 00 00
        00 00 00 08 14 0f c0 dd);
      the IMD has VOL1SINIX0 genuinely in sector R=7 (track0 mode=1 nsec=16 size=128, map 1..16,
        R=7 and R=8 are the only type=1 records, everything else uniform fill);
      the model delivers R=7 to host position 6 = $0FC3DD, exactly where a run starting at sector 1
        puts it.
    RETRACTED with it: "sectors are placed by ARRIVAL, not identity", and the reading of the 0x300
    offset as evidence of a defect.  That offset is CORRECT.
    So the payload is byte-correct, the placement is correct, the label is where the firmware expects
    it - and the firmware still says "no sys-floppy".  The rejection is being made by the HOST on data
    that was delivered correctly.  This failure is not the storager's.
  THE REMAINING LEAD IS HOST-SIDE: >
    The verdict does not follow the 8-sector read (completes 6.41) but a SECOND read - 4 sectors to
    the SAME buffer $0FC0DD at 8.13 - with "no sys-floppy" at 8.3.  Four sectors from the start, into
    a buffer where the label has already been found, immediately before the verdict, reads like
    PARSING rather than fetching.  What the CPUAP does between reading "HDR1 NSC Boot" and concluding
    there is no system floppy is a different subsystem from this campaign.
  THE SYMPTOM, as originally recorded (superseded by the above): >
    The host buffer fills sequentially from $0FC0DD, but the label arrives at $0FC3DD - 0x300, six
    128-byte sectors late.  So sectors are placed by ARRIVAL rather than by identity, the firmware
    inspects $0FC0DD, finds no VOL1SINIX0, and reports "no sys-floppy".
    WHY they are placed by arrival is NOT established.
  TWO MECHANISMS PROPOSED AND BOTH WITHDRAWN - do not resurrect either without new evidence: >
    (a) "the firmware accepts every record in arrival order" - REFUTED: 135 rejects measured at
        $7D4A against 3 records reaching the want-list compare at $7E50.  It rejects heavily.
    (b) "$7D08 reads the node base, so D0 is the constant $95 (the command byte) and the compare is
        vacuous" - WITHDRAWN as a PREFETCH ARTIFACT.  The tap on $7D08 fires on its opcode fetch,
        which the 68000 performs while $7D04 is still executing, so A0 still held its previous
        value.  Fifth instance of that class in this campaign; see storager-measurement-discipline.
        $7D04 is not skipped either - $7CEA/$7CF0 both land on $7D02, which falls through, and
        nothing branches past it.
  next: >
    Why the host address advances per accepted record without regard to the recovered sector ID.
    Both endpoints are instrumented; the compare at $7E58 needs a tap placed clear of the prefetch
    shadow (deep inside the taken branch, not on the compare's own opcode).
  conf: "V (no boot, the 8.3s failure, payload, layout) / ? (the placement mechanism)"

ladder_ownership:   # cont.433 - who runs the read's builder.  READ THE RETRACTION FIRST.
  RETRACTED from cont.432: >
    "The builder emits the correct read ladder (0024 0028 0056 0058 ...), and something overwrites it
    between build and walk."  FALSE, and it was an instrument artifact: $7228 is written with $00fe
    tens of thousands of times per read, it was inside the build-tap range, and it set the image base
    to $7228 - so the "correct ladder" was an image of a different address entirely.  With $7228
    excluded the settled image at $7250 is `001c 0022 0016 0000`, and the trailing
    `0018 0054 004a 0042 0036 0000` is STALE leftover from an earlier, longer ladder.  Nothing
    overwrote anything.
  measured: >
    The builder invoked for cmd 0x95 emits FOUR words - 1c, 22, 16 and a 0 terminator - into $7250.
    That is $5E64, not $5FC0:
      $5E6E movea.w $799a,a3 / $5E72 move.w ($20,a3),d0 / $5E7C btst #$9,d0 / $5E80 bne $5E94
      $5E82 move.w #$1c,(a6)+ / #$22 / #$16   then $5E94 move.w #$0,(a6)   (terminator, no advance)
      $5E98 lea $e000,a1 / $5EA0 move.w #$23f,(a1)+ / dbra   - it loads the E000 program DIRECTLY
    UIB+$20 = $8c27 so bit9 is CLEAR, which is exactly the condition that emits the three ops.
    Loading E000 itself is why these reads capture at all despite never running op18.
  HYPOTHESIS (not settled) - the descriptor holds the PREVIOUS command's builder: >
    The dispatch table at $92-$1A0 holds pairs ($126:5fc0 $128:8c27 - and $8c27 is exactly the
    UIB+$20 measured; $0AE/$0EE/$194 hold 5e64; $132 holds a63e for cmd 0x98).  BUT the table's
    handler word is NOT what gets dispatched: at $0DE4 `move.w (A1)+,D7` / $0DE6 `beq $d60` D7 is
    used ONLY as a zero/validity test and appears nowhere else in the intake path.  The builder that
    actually runs comes from the CHANNEL DESCRIPTOR:
      $2316 movea.w $721a,a1 / $233A movea.w ($6,a1),a1 / $2342 jsr (a1)
    So $5E64 running for a read is most likely 0x87's builder still sitting in [$721a]+$6 - 0x87 is
    the command immediately before every read in the preamble - and `1c 22 16 00` is then 0x87's
    ladder, emitted CORRECTLY by the wrong builder.  Nothing is corrupt.
  HYPOTHESIS REFUTED cont.433b: >
    [$721a]+$6 is NOT the source.  Measured across a full run: ZERO builder-address writes anywhere
    in $7200-$724F, and the slot reads 0000 at every command boundary with [$721a]=7224 throughout.
    Both candidate descriptor bases are covered ($721C->$7222 and $7224->$722A); the only writes to
    $7224-$722E in the entire run are the RAM self-test walking patterns at t=0.12.  A null cannot be
    jsr'd, so the $2316/$233A/$2342 chain is not what transfers control to $5E64.
  ATTRIBUTION CORRECTED cont.435 - the wipe belongs to cmd 0x87, NOT to reads: >
    cont.434 recorded "$5E64 runs ONLY on reads" from $5E82/$5EA0 counts binned per command.  WRONG.
    Reported model-side at the wipe site, with no sampling: `WIPED (16x $023f) during cmd=87`, twice
    per run, and the HOST GO log (same clock, no sampling) puts both wipes 0.7ms after an 0x87 GO.
    0x87 is the command immediately preceding every read in the preamble.
    WHY BOTH PROBES AGREED AND BOTH WERE WRONG: they binned by periodically sampling the node command
    byte, so they were not independent instruments - they were ONE instrument run twice, and the
    node byte lags the GO across a sub-millisecond boundary.  See [[probes-sharing-a-method]].
    WHAT DOES NOT SURVIVE: "$5E64 runs only on reads", and with it the reading that the read's ladder
    is rewritten MID-WALK by a micro-op.  Whether $5E64 runs during reads at all is now UNMEASURED.
    WHAT SURVIVES: A6 = $7250 at the emit (a register read at the tap, no binning); the wipe itself;
    and the model divergence, which never depended on which command $5E64 runs under.
    The `1c 22 16 00` in the buffer is now most simply 0x87's ladder, emitted by 0x87, still there
    when the read walks - the INHERITANCE reading, not the mid-walk rewrite.
  DISPATCH PATH - what cont.435b settled and what is still open: >
    D7 FOLLOWED PROPERLY (transfers and indirect calls, not just stores): $0DE4 `move.w (A1)+,D7`,
    tested at $0DE6, and the ONLY later mentions in 200 instructions are `movem.l D1-D7/A0-A3` save/
    restore at $0F46/$0F6E around calls to $651C and $6CE4 - preservation, not use.  No movea from
    D7, no jsr through it.  D7 really does die at $0DE6.
    THE $92 TABLE IS A PAIR {validity marker, UIB+$20 value}: word0 -> D7 (zero test only), word1 ->
    D6 at $0DEA and thence $0E7E `move.w D6,($20,A6)`.  That is where the measured UIB+$20 = $8c27
    comes from (entry $128).  The handler-looking words in that table are NEVER dispatched.
    THE INSTALL EXISTS, and is gated on the same bit14: $93FC movea.w $71c2,a0 / $9400 move.w
    ($20,a6),d0 / $9404 btst #$e,d0 / bit14 SET -> $940A #$6102, CLEAR -> $9412 #$5fc0 into ($6,a0).
    $8c27 has bit14 clear, so it would install $5FC0, the read builder.
    BUT IT NEVER RUNS.  $93F4 is reached ONLY from $93D6 and $93EA, both `bne` on counter mismatches
    ($93CE addq #1,d1 vs UIB+0; $93DA addq #1,d2 vs the 16-bit UIB+$1a/$1b total) - a CONTINUATION
    path, "more to go, install the builder for the next chunk".  Reads never enter it.
    MEASURED: [$71c2] == [$721a] == $7224 (the same descriptor), slot+6 reads 0000 for the whole run,
    and ZERO builder addresses are written anywhere in $7100-$72FF.  The cont.433b refutation watched
    [$721a]+$6 believing it a different cell from [$71c2]+$6; it is the same address, so its
    conclusion held for the wrong reason.
    $2342 NEVER RUNS (cont.435c, measured at the site - a register read, no binning):
      $231A gate reached 17609 times | $233A slot load 0 | $2342 jsr 0
    The gate `$231A cmpi.b #$ff,($4,A1)` takes `bne $2352` every time, so ($6,A1) is never even READ -
    the unwritten +$6 slot is a consequence, not a cause.  $2342 is NOT the dispatch path.
    THE GATE VARIABLE IS THE "NOISE": descriptor+$4 is $7224+4 = $7228, the cell measured taking
    25572 writes of $00FE per run and excluded from the ladder probe as noise.  The gate wants BYTE
    $FF; the cell holds WORD $00FE, whose halves are $00 and $FE.  Neither is $FF, so this gate fails
    under EITHER byte order - it did NOT change state as a side effect of the byte-order fix, and the
    byte/word pairing here ($231A/$254A test bytes, $0AA2/$0AB6/$15C0/$27F4 write words) is a red
    herring for once.
    WRITER IDENTIFIED (cont.435d): $15C0 `move.w D0,($4,A0)` - the WALKER stores every micro-op's
    return value at descriptor+$4.  A0=$7224 was already measured at the op00 stamps, so the store
    lands on $7228.  The 25572 $00FE writes are op42 returning $FE (WAIT) on every walker pass; the
    gate at $231A is reading the LAST OP'S VERDICT.
    So $FE/$FD/$FF are all WAIT to the walker ($15C8/$15CE/$15D4 all branch to $15FC), but only $FF
    satisfies $231A and lets $2342 dispatch a builder: $FE/$FD mean "re-enter me next pass", $FF means
    "re-enter me AND re-run the builder".
    BYTE ORDER, both true and pointing opposite ways: for the $00FE actually present the gate fails
    under EITHER order (halves $00/$FE, neither is $FF) - so today's failure is not a byte-order
    effect.  But for $00FF it differs: pre-fix byte[$7228] is the HIGH half ($00) and the gate could
    NEVER pass; post-fix it is $FF and the gate CAN.  This dispatch path is only satisfiable at all
    after cont.426.
    NEXT: which handler returns $FF, and why is it not reached?  Greppable rather than measurable.
    First pass: the ONLY immediate $FF into D0 in the ROM is $07A6 `moveq #-$1,D0`, and it heads a
    register-fill (D0->D1->..->A2 all $FFFFFFFF) in an init/self-test routine, NOT a handler.  BOUND:
    that grep covered `70ff` and `303c00ff` only - a computed return, `103c00ff`, or D0 loaded from
    memory would not match, so this is "no immediate-form $FF return exists", not "no handler can
    return $FF".  If none can, $2342 is vestigial or belongs to a command class not exercised here.
    NOT VESTIGIAL - it is the CONTINUATION dispatch (cont.435e): >
      $2342 and $9412's install are two halves of ONE mechanism.  $9412 (install #$5fc0 into ($6,a0))
      is reachable only from $93D6/$93EA, counter-mismatch branches meaning "more chunks to go";
      $2342 is what then re-dispatches the installed builder, gated on the last op's verdict being
      $FF.  A request that fits in ONE chunk clamps the remainder to zero at $738C, never enters
      continuation, and every negative measured this session follows: op $46 never runs, $231A never
      passes, $2342 never fires, ($6,A1) is neither written nor read.  Nothing here is dead code -
      this workload is single-chunk throughout.
      CANDIDATE $FF SOURCE: op $46 ($192+$46 -> $8AC8).  $8F62 move.w #$ffff,D0 / $8F66 clr $7978 /
      $8F6A clr $79b2 / $8F6E move #$2000,SR / $8F72 rts, with no intervening store, and $8F74 is
      op $3E's entry - so that tail belongs to the routine ending at $8F72.  D0=$FFFF -> $15C0 stores
      $FFFF at $7228 -> low byte $FF -> $231A passes.
      Six other $FF-into-D0 sites excluded: $07A6 register fill; $1DAC consumed by bsr $36E6; $1DC8
      unused before bra $1E18; $3656 feeds node+$d0/$d2 and [$793e]; $55B0/$598E feed watch slots.
      $6278's move.b #$ff,D0 is GAP-FILL DATA, not a verdict - $629A move.b D0,(A0)+ / dbra writes it
      28 times, with $4E/$4F on the other arm, selected by node+$12 bit2 (density).  Both "$FF in the
      ROM" hits are data.
      MEASURED (prediction's testable half, all zero as predicted): op $46 body 0, $8F6E return 0,
      $7228 writes with low byte $FF: 0.
      BOUND NARROWED cont.435f - the tail IS op $46's, confirmed statically:
        returns/epilogues anywhere in $8AC8-$8F62 (1178 bytes): ZERO.  A routine boundary requires a
        preceding return, so $8F72 is the FIRST return reachable from $8AC8 and "the tail belongs to
        another routine" is eliminated without needing a run.
        Shared-tail alternative also eliminated: the only references to $8F62/$8F6E/$8F72 anywhere are
        $8F48 bne and $8F4E beq, both INSIDE the span, and there are no data-word references.
      NUANCE: those two branches go to $8F6E, PAST the $FFFF load at $8F62.  So op $46 has return
      paths that skip it and return whatever D0 held - it returns $FF on ONE path, not unconditionally.
      What still needs a run is only whether the $FF path is the one continuation takes.
  CONSTRUCTING THE MULTI-CHUNK COMMAND (the test that exercises all four halves at once): >
    The clamp is $7372 cmp.l D1,D2 / $7374 bcc $738C:
      $7362 move.b ($1,A6),D2   - D2 = UIB+$1, sectors per track (measured $10 = 16)
      $736A btst #$1,D0         - density; bit1 CLEAR = FM
      $7370 addq.w #1,D2        - THE FM LEG ADDS ONE, so D2 = 17 for our media
      D2 >= D1 -> $738C clr.l $7abe (single chunk).  D1 > D2 -> $7376 continuation.
    So continuation needs D1 > 17, NOT ">= 16" - the FM increment raises the threshold by one.
    One such IOCB would exercise $9412's install, $2342's dispatch, op $46's $FF verdict and
    [$7958]'s role simultaneously, and would settle by EXECUTION which of op $46's return paths
    continuation takes.
    superseded_NEXT: who writes $00FE to $7228, and what would write $00FF.  One value, one cell, and the
    write is already known to be hot (25572/run) so it cannot hide.
  superseded_STILL_OPEN: what performs the INITIAL builder dispatch.  The descriptor +6 slot is never written
    by anything, so $2342 `jsr (a1)` through ($6,a1) cannot be it, and the $92 table is not it either.
  superseded_DISPATCH_gap: >
    Something invokes the builder and neither candidate route is accounted for:
      - $2342 jsr (A1) with A1 from ($6,A1): that slot measured as NEVER written, reading 0000, which
        would fault rather than dispatch (cont.433b).
      - the $192 table as op $02: requires an 02 in a ladder, and `1c 22 16 00` contains none.
    $0DE4 `move.w (A1)+,D7` loads the handler word and no `move.w D7,` store was found in the
    following 95 instructions - but that is NOT the same as unused: a movea from D7, or a jsr through
    a register D7 was transferred into, would not match that grep.
    NEXT: follow D7 to its USE with a search covering transfers and indirect calls, not just stores.
    If D7 reaches a jsr, the $92 table IS the dispatch source and the question becomes why 0x95 lands
    on 0x87's entry.  If it genuinely dies at $0DE6, the table's first word is only a validity marker
    and the real dispatch is somewhere none of us has looked.  Inheritance without this is a
    description of the symptom, not a mechanism.
  CONFIRMED cont.434 - $5E64 WIPES the field program (attribution corrected above): >
    Measured per command, tapped deep ($5E82 the ladder emit, $5EA0 the E000 loop body):
      cmd 87 / 98:  emit 0, wipe 0,  E01E last value $0cbb   (a real program word)
      cmd 95:       emit 1-2, wipe 17 or 34, E01E last value $023F, A6 = $7250
    It emits 1c/22/16 through A6 - and A6 is the ladder buffer $7250,
    which survives because the walker's $15AC `movem.w A0-A2,-(A7)` preserves only A0-A2, so a
    micro-op inherits the dispatcher's A6 ($2338 movea.w D0,A6) and rewrites the ladder MID-WALK.
    No install path and no bsr/jsr $5E64 are needed or exist.
    $5E98-$5EA4 writes SIXTEEN words of $023F across E000-E01E.  $023F is the idle/terminate step that
    tails op18's block, so this CLEARS the field program - it does NOT load one.  An earlier note here
    had that backwards ("$5E64's direct E000 load explains capture without op18") - RETRACTED.
    Reads therefore never load a program; they wipe one.
  MODEL DIVERGENCE - the wipe is read as a LOAD: >
    ch_w treats a write to E000 offset 15, preceded by any offset>=1, as the load-complete edge: it
    sets m_prog_loaded and calls start_field_program().  Sixteen sequential $023F writes satisfy that
    exactly, so the model marks a program LOADED and OPENS THE READ WINDOW on the instruction sequence
    that clears it.  Model and firmware then disagree about what the gate array is running, and every
    downstream conclusion about capture is taken against the wrong state.
    FIX SHAPE: the load-complete edge must not fire on a uniform $023F fill.  $023F is the idle step,
    so a block whose every word is $023F is a wipe: it should clear m_prog_loaded, not set it.
  superseded_RELOCATED: >
    From the table dump, $194 holds $5E64 - and $192 is the MICRO-OP JUMP TABLE base (the walker's
    `$15B4 move.w (A0,D0.w),D0` / `$15BA jsr (A1)`), not a command table.  $194 = $192+2.  If $5E64 is
    an op handler rather than an intake builder, then the writes at $7250 that were read as "the
    builder emitting" are a micro-op REWRITING THE LADDER BUFFER MID-WALK - which would also explain
    why no intake path installs it and why no bsr/jsr $5E64 exists in the ROM.
    TEST: does $5E64 execute with the walker's dispatch registers live (A0 = the list pointer cell,
    A1 = $5E64 itself), and does the $7250 write burst fall between a walker dispatch and its return?
    Both are answerable from one trace with a tap deep inside $5E64 (NOT its entry word - entry taps
    have been prefetch artifacts four times in this campaign).
  superseded_next: >
    Write tap on [$721a]+$6 across the 87/89/95 sequence: does a per-command install fire, and what
    value does it write?  Four candidate writers in the ROM - $0AA6, $27EE, $2AA4, $34BC - one of
    which should be the per-command install.  If nothing fires between the 0x87 and the 0x95, that is
    the whole defect.  Prediction to check against existing data: if earlier reads in the same run ran
    $5FC0 correctly then the install DOES fire sometimes, and when it stops is the question.
  instrument_notes: >
    Two conflations fixed here, both of which had produced published numbers:
    (1) node+$26 <- $000C has TWO writers - $15A0 move.w d1,($26,A2) is the WALKER's terminator and
        $17F8 move.w #$c,($26,A0) is the phase-0x0C path.  Same value, same width; the only separator
        is which base register holds the node.  Every A1 reported at cont.432 ($9188/$7664/$79F6) was
        $17F8, never the walker.
    (2) Overlapping write taps on one space do not both fire.  ONE tap must own a range and dispatch
        internally by address (docs/storager-lle/ladder.lua does this).
  conf: "V (which builder runs, and what it emits) / ? (why the descriptor holds it)"

frontier_read_ladder_not_built:   # cont.431 - the named corruption, with a two-line test in front
  finding: >
    A cmd 0x95 posts 0x80 in 70ms having executed NO read ops.  The walker's list at $7250 holds
    `001c 0022 0016 0000 | 0018 0054 004a 0042` where a working command (cmd 0x87) holds
    `0024 0028 0056 0058 | 0018 0054 004a 0042`.  The walker takes the op00 path on that zero
    ($158C move.w (A1),D0 / $158E bne - op00 is detected by (A1) reading ZERO, NOT by position),
    stamps node+$26 = $000C and exits, leaving op18/op54/op4A/op42 unexecuted in the list behind it.
    The runaway capture follows: the RETAINED field program is still armed with no ladder managing it.
  the_head_is_another_command: >
    `1c 22 16 00` are NOT truncated read ops - $5FC0 emits 24 28 56 58 [1A] 18 54 4A 42 36 00 and none
    of 1c/22/16 is in that set.  They are valid ops ($1C->$355C, $22->$9018, $16->$2BD6) properly
    terminated with 00, i.e. a DIFFERENT command's ladder, intact.  The tail (18 54 4a 42) is
    byte-identical to the working command's, so only the head differs.
  REFUTED cont.432 - the builder does NOT bail: >
    Measured at every command intake: node+$a/$b vs the host's own bytes.
      cmd=87  node+a=01 node+b=00  host+a=01 host+b=00  guard PASSES
      cmd=95  node+a=00 node+b=08  host+a=00 host+b=08  guard PASSES   (8-sector read)
      cmd=95  node+a=00 node+b=04  host+a=00 host+b=04  guard PASSES   (4-sector)
      cmd=95  node+a=00 node+b=02  host+a=00 host+b=02  guard PASSES   (2-sector)
    $5FC0's both-zero guard never fires, so the builder RAN AND EMITTED.  The $6A-vs-0x80 tension was
    correct evidence against the hypothesis, not a detail to explain away.  Dave's standing point is
    what made it checkable: the CPUAP's IOCB is KNOWN GOOD from the HLE booting, so "a real guard
    firing on malformed input" was never available as a reading - a zero there would have been ours.
    The copy is also confirmed FAITHFUL: node+$a/$b match host+$a/$b byte-for-byte, and node+$b
    carries the sector count (08/04/02) matching the reads traced.
    So the zero at $7256 came from somewhere else and the frontier is open again.
  FIFTH model<->SRAM byte boundary (found while testing the above): >
    The IOPB->node copy at the GO doorbell is `cs.write_byte(dst+k, bs.read_byte(dbi+k))` with NO
    swap - cs.write_byte goes through the swapped mapping, bs.read_byte does not.  Consequence: node
    BYTE reads round-trip correctly (which is why the guard's inputs are faithful and why the command
    byte works), but firmware WORD reads of node fields see SWAPPED HALVES.  run_channel_dma has an
    explicit swap that was inverted under the flip; this path has none and was never audited.
    THE_RULE in sram_byte_order enumerated three boundaries and later a fourth (the accept tap); this
    is the fifth.
    AUDIT BY CRITERION, NOT BY LIST (the list first written here was assembled from memory and every
    item on it was wrong):
      AFFECTED = host-written (node+$00..$17, the copy's range) AND firmware-WORD-read.
      Byte reads round-trip (both ends flipped).  Firmware-written fields round-trip within firmware.
      Only a field the HOST supplies and the firmware then reads as a WORD sees swapped halves.
    The three originally flagged all fall OUTSIDE it, verified against the disassembly:
      UIB+$12 bit1  - byte reads throughout ($1018/$103E/$104E/$19F8 move.b ($12,A6)).  Unaffected.
      UIB+$20 bit14 - word read at $A35E, but firmware-written at $0E7E move.w D6,($20,A6).  Outside.
      node+$18      - word read at $17FE, but firmware-written at $15DA/$1A4C.  Never copied.  Outside.
    SWEEP RESULT: zero word reads at displacement <$18 off any register loaded from $71bc, $7b20 or
    $7a06 (39 load sites checked).  The affected set is EMPTY as far as this reaches, consistent with
    a byte-oriented IOPB - the firmware reads host-supplied fields as bytes throughout ($5FC8/$5FCC,
    $A650/$A656, $0DEE, $0E88).
    BOUND: the sweep follows a register up to 20 lines from a DIRECT load of those three cells; it
    does not follow node pointers passed across calls or held longer.  Empty-as-far-as-checked, not
    proven empty.  The boundary is still real and the copy should still be made explicit.
  superseded_cause: >
    The read's builder never emitted anything, leaving the PREVIOUS command's list in the buffer.
    $5FC0 has exactly that exit, two instructions in (verified from ROM):
      $5FC4 movea.w $71bc,a2 / $5FC8 move.b ($a,a2),d0 / $5FCC or.b ($b,a2),d0
      $5FD0 bne $5FDA        <- both zero FALLS THROUGH:
      $5FD2 move.w #$6a,d0 / $5FD6 bra $60F6   (error $6A, nothing emitted)
    If node+$a and node+$b are both zero the builder bails before writing a single word.
  TENSION - the hypothesis makes a prediction the data may already contradict: >
    $60F6 does NOT post anything.  It is `tst.w $796a / bne $6100 / bsr $1242 / $6100 rts`, so the
    bail RETURNS D0 = $6A to the dispatcher's jsr (A1) at $2342 rather than stamping a status.  The
    story therefore predicts D0 = $6A back from the builder, against an OBSERVED outcome of 0x80.
    Either the dispatcher drops the builder's return value, or the bail is not what happened.
    Do not open next session treating the bail as established.
  cheapest_test: >
    ONE RUN, three values at the same tap point: node+$a and node+$b at the read's builder entry,
    whether $5FDA is reached, AND D0 at $6100.  The last one is what discriminates "bailed and the
    error was dropped" from "did not bail" - node+$a/$b alone cannot, if they turn out non-zero for
    an unrelated reason.  If the builder bails, no write tap on $7250 is needed: nothing wrote the
    zero, it was always there.
  not_a_byte_order_question: >
    Ruled out BY INSPECTION, not by measurement: `move.b ($a,A2),D0 / or.b ($b,A2),D0` reads both
    halves and ORs them, so the zero/non-zero result is byte-order independent.  Byte order has been
    the answer twice in this campaign (see sram_byte_order); it is not the answer here.
  shared_idiom_not_exotic: >
    The identical both-zero guard appears in the WRITE builder at $610A-$6118 (same test, same #$6a,
    out via $6206).  A shared malformed-IOCB idiom, which makes it more likely to be a real guard
    firing on bad input than a corruption artifact.
  ruled_out: >
    Wrong channel ([$721a] measured 7224 on EVERY op00 stamp, both commands, and both walk base
    $7250, so build and walk agree).  Allocator exhaustion (free-list healthy at exit on all reads).
    The $7B1C watchdog as the timebase (zero arms).  A retry loop ([$79aa] 0 at both ends).  Any
    fixed-duration timeout (2.7s / 12.2s / 18.3s for the same command is a 6.8x spread).
  also_seen: >
    Two op00 stamps during cmd 0x95 have A1 OUTSIDE the ladder - $7664 (inside the ledger) and $79F6
    (the E802 shadow) - both with A0=$71F0 (the node) rather than A0=$7224 (the descriptor).  That is
    a DISTINCT condition from the truncated-ladder stamps, not the same pointer wandering.
  instrument_notes: >
    node+$26's $000A state lasts ONE walker pass ($15A0 writes it, $15A4 advances), so a polling
    sample cannot see it - it needs a WRITE tap with the base from [$71bc].  An earlier "parks=0" was
    that artifact and is WITHDRAWN.  Also: overlapping write taps on one space do not both fire - a
    build-side tap on $7220-$7270 recorded nothing because a $7100-$72FF tap already covered it.
  conf: "V (the corruption and its effect) / ? (whether the builder bailed)"

frontier_cmd95_18s:   # cont.430 - the named frontier, with its test already defined
  state: >
    Under program retention the boot reaches 13 commands / 10 clean 0x80 and then loops: a cmd 0x95
    fails with host status 0x82/$29 after ~18.3s, the host re-runs the 87/89 preamble (both complete
    cleanly) and reissues the same read.  The 87 and 89 around it passing means the seek and the ESDI
    status command are fine; it is that specific read.
  open_question: >
    Is the 18.3s an OUTER RETRY LOOP over the 1.305s $7B1C watchdog, or a distinct mechanism?
    18.3 / 1.305 = 14.02, and [$79aa] is a retry counter (incremented $9328, clamped to 15 at $1A6A
    before being reported in the status byte), so fourteen periods with give-up on the fifteenth fits
    to within measurement error.  That would also explain $29 vs $1C without a second mechanism: $1C
    is what each ATTEMPT stamps, $29 what EXHAUSTION reports.  Note the four $2029 sites split
    cleanly - $7E02/$8AB2 write into a structure ((A0)), $979E/$99FE load it into D0 as a RETURN
    VALUE, and the latter pair (in the $9xxx region, not the record path) is the shape of a give-up.
  RETRACTED: >
    "18.3s is too long for the 1.305s watchdog, therefore not that mechanism" was an inference stated
    as a fact.  It only follows if nothing retries.  Do not reuse it.
  acceptance_test: >
    Count watchdog arms ($7986 <- non-zero) between the failing read's OWN GO and its OWN error post,
    WITHIN ONE RUN - never across runs, the arm time is RTC-seeded and moves seconds.
    The test is a RATIO, not a tally: does count x 1.305s account for the elapsed ~18.3s?
      accounts for it  -> outer retry loop; frontier restates to "why does each ATTEMPT fail",
                          which the existing watchdog tooling already addresses
      does not         -> distinct mechanism (this collapses the 0-arm and small-non-zero cases
                          into one answer, which is what you actually want to know; a bare count
                          threshold answers nothing at 2 or 3)
  already_established: >
    The CANCEL machinery is live: a real arm/cancel pair was measured at 3.3202/3.3203 - the cancel
    fires within a tick of the arm.  This is a within-run structural observation and is seed-immune,
    so it survives even though the run it came from could not reproduce the 18.3s case.  Therefore an
    uncancelled watchdog on a failing read means THE CANCEL CONDITION WAS NEVER REACHED, not that the
    cancel path is broken.  One branch removed from the search before it starts.
  RESULT: >
    ANSWERED cont.430b, one run, per-command and within-run (docs/storager-lle/rtratio.lua):
      failing read #1  elapsed  2.738s  arms=0  cancels=0  ->   0% accounted
      failing read #2  elapsed 12.157s  arms=0  cancels=1  ->   0% accounted
    ZERO watchdog arms during either failure, so $7B1C cannot be setting the pace and the ratio
    question does not arise.  The retry-loop hypothesis is REFUTED for these instances; the ~18s
    class of cmd 0x95 failure is a DISTINCT mechanism, which is what the (retracted, then re-opened)
    original reading said.  [$79aa]/$1A6A remains a good lead for why $29 differs from $1C, but it is
    not driving the elapsed time.
    Instrument liveness proven INSIDE the measurement, not assumed: the same tap counted a cancel in
    read #2's window, so it was live and would have counted an arm.
    LIMIT: this seed produced 2.7s and 12.2s failures, not the 18.3s one - the mechanism answer is
    consistent across both instances but the exact 18.3s case is not individually measured.
    12.157 / 1.305 = 9.3 (non-integral), independent corroboration that the period is not the clock.
  next: >
    The elapsed time has some other source.  With the watchdog excluded and the cancel machinery known
    live, look for what the failing read WAITS on - a second deferred-write period, a seek/settle
    timeout, or a poll with its own counter - rather than anything in the $7986/$29F8 family.
  conf: "V (the failure, its timing, and that the watchdog is not its clock) / ? (what is)"

sram_byte_order:   # cont.426 - THE correction; read this before trusting any byte-level claim
  finding: >
    Byte accesses to the local $4000-$7FFF SRAM resolve to the OPPOSITE half of the 16-bit word from
    what a plain big-endian mapping gives. Word accesses are unaffected. The model had `map(...).ram()`
    in a BE space, which is the standard wiring and was the wrong premise for this board.
  the_tell: >
    Three independent sites share one signature - the firmware writes a WORD and then tests that same
    value as a BYTE at the identical effective address, expecting the word's LOW half:
      $15A0 move.w d1,($26,a2) D1=$000A   vs  $161C/$162A cmpi.b #$a,($26,a1)
      $70D4 move.w #1,($7a30).w           vs  $833C       bclr   #0,($7a30).w
      $1314 move.w #$81,($2,a0)  busy     vs  $1A54       move.b #$80,($2,a0)  done
    Under BE the byte op reads the high half and gets $00 - every time, at three unrelated sites. The
    third is the tell that should have been caught first: busy and done are ONE status field, and no
    firmware stamps them into adjacent bytes.
  measured_result: >
    With the mapping corrected and BOTH standing patches disabled (Q2_PRESERVE_KICK_ARM and the
    node+$26 deposit), the 8-sector FM read completes and posts 0x80, the 4-sector read completes, and
    the run reaches 12 commands / 10 clean 0x80 completions. Corroboration beyond the criterion:
      - busy ($81) and done ($80) now both land in node+2 - one field
      - op42's 1.83s guard vanishes (completion 0.5ms after the last sector, not 1.67s)
    Neither was something the hypothesis was tuned to produce.
  what_it_retires:
    - "Q2_PRESERVE_KICK_ARM - $70D4 now ARMS the kick, which is what a failure branch should do"
    - "the node+$26 gate-array deposit - the park's own word write satisfies the pump's cmpi.b"
    - "the 1.83s op42 guard and the UIB+$12 bit7 'operation complete' deposit built to bypass it"
    - "'busy and done land in different bytes' - they do not"
  hardware_mechanism: >
    HYPOTHESIS, not established. A 68000 defines even-byte = D15-D8 via /UDS, so a board cannot invert
    byte addressing by swapping strobes alone - it would have to cross both the strobes and the data
    halves at the two byte-wide SRAMs, i.e. store every word byte-swapped. That is an unusual thing to
    build and is invisible except through exactly this signature. The BEHAVIOUR is measured; the WHY is
    not. Do not write the mechanism up as fact.
  THE_RULE: >
    Firmware-internal byte structures stay self-consistent, because both ends flipped together. The
    ledger ($706C move.b #$aa, the $8120/$8128 stakes, the $7E6C walk's cmpi.b) is written AND read
    entirely by firmware, so cont.419's layout SURVIVES unchanged.
    What inverts is any boundary where the MODEL touches SRAM at byte granularity and the other end is
    not the firmware. Enumerated, there are three, and all three are now load-bearing:
      1. run_channel_dma  - local read_byte/write_byte vs the host. The compensation inverts to
         `swap = is_data ? 1 : 0`. Getting this wrong kills the boot at command 1.
      2. the capture record at $7DAC - model write_byte -> firmware byte reads.
      3. the chunk data staging - model write_byte -> DMA read_byte.
    (2) and (3) are currently correct BY ACCIDENT, because both of their ends flipped together. That is
    now a load-bearing property and must be stated, not assumed.
  re_derive_not_correct: >
    Every byte-granularity observation in this campaign was taken through the inverted mapping -
    INCLUDING the ones that appeared to confirm something. Byte-level claims elsewhere in this file are
    RE-DERIVE, not correct, unless they fall under THE_RULE's firmware-internal case.
  cheap_general_check: >
    Whenever a byte gate "can never match", compare it against the WIDTH of whatever writes it. A
    firmware that writes a word and then tests the same value as a byte at the same effective address
    is telling you your byte mapping is wrong. This cost four months of halved resolution.
  conf: "V (behaviour, measured) / ? (hardware mechanism)"

gate_array_deposits_node26:   # RETIRED cont.426 - the mechanism was wrong; do not amend, do not revive
  RETIRED: >
    The whole section is void. Its central argument was: "27 word writes, 6 word reads, exactly 3 byte
    accesses at node+$26, no byte writer exists in the ROM, therefore the gate array must produce the
    byte." The word writes WERE the byte writer - $15A0 `move.w D1,($26,A2)` with D1=$000A puts the $0A
    in the half the `cmpi.b` reads, once the SRAM byte mapping is right (see `sram_byte_order`).
    The behavioural evidence recorded below was REAL - depositing the byte did flip $1646/$1676/$7964/
    $32AC/[$72d6] exactly as described. That is why this looked so solid for so long: a correct
    observation attached to a wrong mechanism. The deposit worked because it manufactured, by hand, the
    value the firmware's own word write should have produced.
    The model's deposit is REMOVED as of cont.426; the read completes without it.
    Original text retained below for provenance only - none of its reasoning should be reused.
  claim: >
    The gate array writes the BYTE at node+$26 (=$7216 for node $71F0). It has the means and the
    mechanism: it is a bus master over the same 16KB SRAM, and the firmware hands it the node base via
    D000 ($38F8 -> $71F0), so node+$26 is directly calculable from a value it already holds.
  why: >
    node+$26's byte is the ONLY field in the fully-traced completion path that the firmware CONSUMES but
    can never PRODUCE: enumerated across the whole ROM there are 27 word writes, 6 word reads and
    exactly 3 byte accesses at +$26 - all of them `cmpi.b #$a` compares ($161C/$162A/$16BA). No byte
    writer exists. The word writes ($15A0 `move.w D1,($26,A2)` with D1=0x000A) put the 0A at +$27 and
    leave +$26 = 00, so the three byte gates are unsatisfiable by firmware alone.
  measured_effect: >
    DIAGNOSTIC (TEMP, not shipped): depositing byte 0x0A at node+$26 after the firmware parks the node
    flips the behaviour decisively - $1646 DISPATCH 0 -> 353162, $1676 jsr callback 0 -> 1,
    **$7964 (the read's completion routine) 0 -> 1**, $32AC chunk walk 0 -> 18, and **[$72d6] clears
    727e -> 0000**. None of that happens without the deposit. This is behavioural evidence, not a
    static-signature argument (the earlier "byte-tested, never byte-written" signature was shown to be a
    common firmware idiom - e.g. $6C54 deliberately reads the HIGH byte of node+$18 as the guard count).
    NOTE cont.426: that $6C54 reading INVERTS with the corrected byte mapping and is RE-DERIVE, not
    correct. It was the first claim predicted to stop making sense if the byte-order hypothesis held.
  remaining_gap: >
    $7964 clears every gate that mattered - including [$7956]==0 - and then exits at $79A6 because
    **[$796c] == 0**, so it never reaches $79BE/$79CA and [$7968] stays 1, leaving status 0x81.
    [$796c] is set at $70C6 (`move.w #$1,$796c`) inside the drain/builder region that runs only twice,
    so it is plausibly a casualty of the same upstream stall rather than a second hardware signal.
    OPEN: the TRIGGER - when the gate array should perform the deposit. Structural constraint: the pump
    only runs at phase 0x0A, which only exists after op42 returns, so the deposit cannot be consumed
    before the park. Depositing at count-exhaustion (t=8.16) is clobbered by the firmware's own word
    write of 0x000A at the park (t=9.7867).
  conf: "V (mechanism, per Dave) / ? (trigger)"

open_frontier:
  - id: phase0A-byte-gate-cannot-match   # RESOLVED cont.426 - see sram_byte_order
    RESOLVED: >
      The gate could not match because the model's SRAM byte mapping was inverted, not because the
      firmware cannot produce the byte. $15A0's word write puts $0A exactly where $161C/$162A's
      cmpi.b reads it, once the mapping is right. Watch-pump gate 3 resolves with it. Do not reopen:
      the argument is closed by construction, not by evidence that could shift.
    state: >
      The read PARKS AT PHASE 0x0A and then spins forever because a byte-gate can never match a
      word-written phase. Measured with RETAINED tap handles and a LATE control ($224a, 3 hits - once
      per command):
        node [$71bc] = $71F0 (even). Phase trace for cmd 95:
          6.4129 [$7216]<=0004 ($262c) ; 6.4130 <=0006 ($2006) ; 6.4139 <=0008 ($224a dispatcher)
          9.7867 <=000a ($15a4 = op36 park) -> stays 000a to the end
        node bytes +20..+29 = 00 00 00 00 7f f8 | 00 0a | 8c 27   i.e. **+$26=$00, +$27=$0A**
      The park writes a WORD: `$159C move.w #$a,D1 / $15A0 move.w D1,($26,A2)` = 0x000A, so on the
      big-endian 68000 the byte at +$26 is $00 and the $0A sits at +$27. But THREE readers test a
      BYTE at +$26 - `$161C` and `$162A` (the two $15FE pump legs) and `$16BA` - so none can ever
      match. The firmware is internally inconsistent here: phase 0x0C is tested as a WORD
      (`$1582 cmpi.w #$c,($26,A2)`) while phase 0x0A is tested as a BYTE.
      The other pump leg is dead too: [$71b6]=0000 (installed only for IOPB options bit4, which the
      monitor's 0x95 never sets - see phase_dispatch.fast_path_71b6), so $161C indexes from address 0
      and reads ROM[$0026] = $02, also no match.
      Counts over the stall: walker $156A 31847, op42 $6BC2 31844, op36-park 31865, op00-done 31862,
      pump $15FE 141913.
      **READ THESE CORRECTLY (Dave, cont.420):** they are NOT evidence of healthy activity. They are
      the RETRY LOOP - the read never completes, so the firmware re-arms and tries again as each
      Address Mark comes round, and op42 is re-entered once per attempt. A large count here means the
      failure is repeating quickly, not that the machinery is working. An earlier draft of this entry
      called it "a healthy live spin, NOT a dead stop"; that was wrong emphasis and is retracted.
      Corollary: the count is mark-driven, so it scales with the model's record-delivery rate (a 200us
      pump, ~60x faster than real media) and carries no information about progress.
    RETRACTED_EARLIER_IN_THE_SAME_SESSION: >
      An earlier cont.420 measurement claimed "the walker runs 0 times and op42 runs 0 times". That was
      a GARBAGE-COLLECTION artifact: MAME's Lua install_*_tap returns a handler object, and if the
      handle is not retained Lua GC removes the tap silently. Its control ($9C3E) fired 49164x at
      t~0.1 - BEFORE the GC - so it never validated the tap at t=6.4 when the walker actually runs.
      Retaining the handles turned 0 into 31847. A control must fire at the SAME TIME as the event.
    corrected_values: >
      All re-measured safely and stable from
      t=11.58 to t=30 (1058 samples): [$798e]=0001 (NOT 0000 - so even if op42 ran it would take the
      >0 settle path, not the $FE path), [$7a36]=0001 (settle IS satisfied), [$7a40]=0000 with
      [$7a3e]=0001 (guard timer armed at 7360 then expired at t=9.80), [$7a64]=0001, [$7968]=0001,
      [$72d6]=727e, [$727e]=0000, [$7b40]=0000, [$7a70]=0000, node+$20=8c27 bit14=0, [$7956]=0000
      (count fully consumed 8->0 between t=7.97 and t=8.16), [$7a0c]=0003, node+$18=4603.
      ALSO CORRECTED: **[$74b4]=74c4 persists** - the descriptor queue does NOT drain to 0. The
      cont.405/406 "drains to 0" claim does not reproduce and should be re-taken.
    WHY_73FA_IS_NEVER_CALLED:   # cont.420 - answered, validated (control $15FE = 141913)
      caller_of_op42: >
        op42's ONLY caller is the walker's generic micro-op dispatch: the return address on the stack
        at op42 entry is **$0015BC** in 400 of 400 samples ($15B4 `move.w (A0,D0.w),D0` -> jsr through
        the $192 table). $9492 and $9A2E - the two routines that contain the $73FA calls - NEVER CALL
        IT, and never execute at all. That is why $94AE and $9A48 measure 0: not "op42 returned
        non-zero there", but "that code does not run".
      op42_does_reach_done: >
        Measured with a PREFETCH-IMMUNE write tap (op42's done-leg passes $6CC2 `move.b #$9a,$8007`,
        an 8-byte instruction, so the PC logs as $6CCA): it fired **exactly once** in the run, next to
        $6854 (op28's ctr2 arm, also once). So of 31844 op42 calls, ONE returned D0=0 and the rest
        returned WAIT. An earlier tentative "op42 never returns 0" is WITHDRAWN. The single DONE lines
        up with the phase trace - op42 returned 0 at ~t=9.79, the walker advanced, and $15A4 wrote
        phase 0x0A (the op36 park).
      the_structural_answer: >
        $9D6E - the routine holding $9DD4 `[$7a70]<=ffff`, which is what makes $974C set node+$20 bit14
        - is **micro-op 0x4E** in the $192 table. The read's ladder is 24 28 56 58 1A 18 54 4A 42 36 00
        and contains NO op 0x4E. So the transfer-phase flag is set by a micro-op the read never
        executes; bit14 stays 0; and even if $9492/$9A3E did run, both $73FA call sites are gated on
        that bit. Two independent reasons the terminator is unreachable.
      next: >
        Decide which is the real question: (a) should the read's ladder contain op 0x4E (i.e. is the
        ladder built wrongly, or built right and 0x4E belongs to another command class)? or (b) is the
        read meant to terminate through a path that does NOT involve $73FA at all, given $73FA's only
        two callers are dormant? Enumerate what dispatches $9492/$9A3E before assuming either.
    SUPERSEDING_MEASUREMENT: >
      cont.420 (late): the count-reaches-zero terminator **$73FA IS NEVER EXECUTED** for cmd 0x95.
      Tapped with a validated control ($15FE, 178580 hits): $73FA shows 1 hit but $75A6 shows 0 - and
      EVERY path out of $73FA reaches $75A6 ($7410 bra; $7596 falls through to $75A4/$75A6; $749E bra),
      so the single hit cannot be an execution. It is PREFETCH: $73F8 is an `rts` and the 68000
      prefetches $73FA straight past it (discipline failure class 2 again).
      CONSEQUENCE: the analysis below of node+$0e, op44's return and the [$7b40]->[$727e] chain
      describes DORMANT CODE. Those gates were measured accurately but they never run, so they cannot
      be the reason the read fails to terminate. $73FA's only callers are **$94D8 and $9A5E** (both in
      the op42-completion region), so the real question is why NEITHER caller is reached.
      METHOD NOTE, generally applicable to this whole file: establish that a routine EXECUTES before
      analysing its gates. Several long investigations here (the phase byte-gate, this [$7b40] chain,
      and the earlier "(A1)-bit7" reading) analysed code that was never running on the read path.
    next: >
      FIRST establish which of $94D8 / $9A5E should call $73FA for the read and why neither is reached
      (validated control mandatory - a late one, and retained tap handles). Only then re-open the gate
      analysis below, which is retained because the measurements are sound even though the code is
      dormant. HOW DOES A REAL BOARD EVER PASS THIS GATE? Candidate answers:
      (1) CLOSED cont.420 - NOT a host/IOPB problem, and not a model bug. The [$71b6] install at $1144
      is gated on `btst #4,D5`, and D5 is NOT an IOPB options byte: `$0EAE move.w ($20,A6),D5` with
      A6=$6E60 gives D5 = [$6E80], measured **8c27**, whose bit4 is 0. That word is FIRMWARE CONSTANT
      DATA: 8c27 occurs in the ROM at offset **$128**, which is the flags half of the cmd-0x95 entry in
      the $92 dispatch table (4-byte {handler,flags} entries; index 0x95-0x70=0x25 -> entry $126,
      flags $128). The same word is what lands at node+$20. So bit4 is clear BY DESIGN for cmd 0x95,
      [$71b6] correctly stays 0000, and the $161C pump leg is dead by design for the read - only the
      $162A leg on [$71bc] is ever in play. The old note's phrasing "IOPB options bit4" was wrong;
      the deleted cont.252 note ("D5 = [UIB+$20]") had the right cell but it is ROM-sourced, not host.
      (Also confirmed while measuring: $6E84 onward is op18's descriptor list - the observed bytes
      00 17 01 / 00 1c 01 / 00 1d 00 / 00 1d 01 / 00 3f 00 / 00 3f 01 / 02 01 01 / 02 1f 01 / 7e 3f...
      match the documented op18_descriptors exactly, so [$7938]=$6E84 is verified.)
      (2) The read may not be meant to park at 0x0A at all: cmds 87 and 89 both reach phase 000c and
      complete, and 0x0C is WORD-tested so it works. The read parks only because op42 keeps returning
      WAIT and the ladder walks on to op36. Fixing whatever makes op42 wait may make the byte gate moot.
      (3) Only if both fail: consider that +$26/+$27 is a two-BYTE field (a state byte plus a phase
      byte) rather than a word, which would make every "phase word" reading in this file wrong.
      Do NOT patch the model to force the gate - that is HLE.
    conf: V
  - id: first-field-has-no-chunk   # cont.406, narrowed cont.407
    state: >
      R=01 is dropped. At the first data field there has been no prior $8018 done, and [$741e] is still
      0 (the first $7BA8 setup is what initialises it to $2000), so every arm writes 0 and the sector
      has no destination. Host slots end up [R02,R02,R03..R08]; the duplicate at the head is the
      FIRMWARE's own descriptor sourcing an unarmed chunk, not a model artifact.
      NARROWED (cont.407): this is NOT the load-vs-run ordering. Deferring the window to load-complete
      is now implemented and verified - no record is delivered mid-load - and R=01 is UNCHANGED. The
      two are independent. C800[0] for field k is written at field k-1's done, and for k=0 there is no
      k-1, so the first field's destination must come from op18 itself.
    next: >
      Find what op18 leaves as the initial chunk. Candidates: one of the descriptor pushes (the 8
      port-$3F pushes, or the cell-0 sequence whose last value is $3F), or a register the model does
      not decode. Test the push-count prediction: drive a read with a sector count other than 8 and
      watch the port-$3F push count - all nine observed loads are identical 8-sector label reads, so
      it is untested, not falsified.
    conf: "?"
  - id: transfer-launch-path-for-the-read   # cont.408
    state: >
      op $3E ($8F74) is the TRANSFER-LAUNCH micro-op: it forks on node+$20 bit11 (set -> build the $7442
      staging-channel descriptor + call the $3ABC scheduler at $8FEA; clear -> a local memory fill).
      node+$20 = $8C27 = the READ's param word from the $92 dispatch table; bit11 IS set, bit9 clear,
      bit14 clear. BUT op$3E is dispatched ZERO times and is NOT in cmd=95's ladder - so the read's
      transfer must be launched from the interrupt path, not a micro-op. The descriptor IS queued
      ([$74b4]=74c4 after sector 1's done) but nothing dispatches it: [$743a] stays 748a, never $7442,
      and DESCGO ($4102) never runs.
    next: "identify which of the $3ABC callers ($3DAC/$3F36/$3FB2/$44A2/$496E/$8FEA/$9E86) is meant to launch the read's per-sector transfer, and what gates it. Compare only between HEALTHY runs - check stages/program-load counters first (cont.408)."
    conf: "?"
  - id: dma-engine-park-kick   # cont.409 - the synchronisation method, DECODED
    state: >
      The DMA engine is a self-clocking IRQ4 chain (launch -> DMA -> IRQ4 -> callback $3F68 -> $3FD0 ->
      $3FF2 -> $3E3A -> queue walk -> $3F36 -> launch next). Nothing polls the gate array for transfer
      completion: the completion signal is IRQ4 and the "wait" is the busy lock [$7a1a]. When the queue
      empties the engine PARKS ($3DE2 bset #0,$7a30 = idle) and is restarted by an atomic test-and-clear
      KICK at the tail of the done handler ($833C bclr #0,$7a30 / beq / bsr $3dbc). The only busy-wait
      in the path is $8FF4, on the op$3E path.
      DEAD KICK (cont.409): [$7a30] is written by two DIFFERENT-SIZED accesses. 68000 bit ops on memory
      are always BYTE-sized, so bset/bclr #0 act on the byte at $7a30 (the HIGH byte of the word), while
      $70D4 `move.w #$1,$7a30` is a WORD write that zeroes that high byte. Once $70D4 runs, every $833C
      kick finds the flag already clear and the engine can never restart.
      TRIGGER (cont.409a): $70A0 runs once in BOTH timing models but takes a different branch - at true
      speed it runs BEFORE any sector completes (count still 8 -> $70D4 -> clobber); in the arm-driven
      model it runs at the END (count 0 -> $70A6, no clobber). The firmware is not running ahead of the
      hardware: at true speed it is given idle time it never had, and in that gap it runs a path that
      disables its own DMA restart.
    next: "find what reaches $70A0 during the op42 wait gap, and whether the drive stimulus the model does not present during that gap (index/rotation) is what the firmware is actually waiting on there"
    conf: V
  - id: physical-record-timing   # cont.408 - attempted and reverted
    state: >
      Records are delivered on a 200us model pump; the disk's real rate is 12.5ms/sector (FM 16x128B at
      300rpm), so the run is ~60x too fast, and the first record was being delivered INSIDE op18's block
      copy (before its rts, so op42 was never entered). Making the timing physical kept the handler
      cadence perfect but killed the transfers, and the reconstructions used to diagnose that were in a
      runaway retry loop - so the cause is NOT established. Reverted.
    next: "re-introduce physical record timing as its own isolated, repeat-verified step; watch aggregate health counters (stages / program loads), not just the DMA count"
    conf: "?"
  - id: op18-selector-bit-unmodelled   # cont.406
    state: "each op18 descriptor carries a one-bit selector on the UDS/LDS choice of a dummy $6000/$6001 read; the model backs $6000 with plain RAM and drops it. Meaning unknown - 1d/1d and 3f/3f pair as sel=0 then sel=1, suggesting it picks between two banks/halves."
    next: "model $6000/$6001 as a gate-array push strobe and see what the selector distinguishes; correlate against the E000 step words"
    conf: "?"
  - id: data-swap-control-bit   # cont.406
    state: "control blocks swap bytes, data must not; the model keys on field type as a stand-in"
    next: "find the swap-control bit in the IOCB/UIB that the real gate array uses"
    conf: "?"
  - id: op42-gate-is-798e   # RE-DERIVE cont.426 - measured through the inverted byte mapping
    RE_DERIVE: >
      op42 now completes in 0.5ms with the byte mapping corrected, so the "[$798e]==0 -> $FE forever"
      reading and everything built on it must be re-taken. [$798e] may still matter; the evidence that
      made it look like THE gate does not survive. See sram_byte_order.
    state: >
      op42's master control is [$798e]: <0 -> DONE at once ($6BC2 blt $6CDA); >0 -> the bit7/settle
      path; ==0 -> falls to $6C28 where (A1)=node+$18 (the ERROR field, not a status word) is zero, so
      it returns $FE (WAIT) forever. Measured [$798e]=0000, and node+$12=$40 so bit7 is clear too.
      [$798e] is the SEEK-COMPLETION flag: op28 (the seek engine) either sets it to 1 immediately at
      $68FA (no settle needed) or clears it at $6904 and schedules a deferred write of 1 after
      (steps * UIB+$19)/10 + 1 ticks, pending cell [$7990]. Sibling of the spin-up settle [$7a36]
      (armed in op24 from UIB+$14, 6*10 ticks = 1.55s, VERIFIED firing correctly).
    next: "does op28 reach $68EA during the read at all? Its only traced gate-array access is one E804 write at $6B20, consistent with the seek short-circuiting on an on-track drive - in which case [$798e] is never written and simply retains its power-on zero. Tap $68EA/$68FA/$6904 and the [$7990] pending cell."
    RE_MEASURE_FIRST: >
      cont.420: the "[$798e]=0000" that defines this whole frontier must be RE-TAKEN with a
      non-corrupting probe. See lua-sram-reads-corrupt-the-model - polling SRAM from Lua clobbers
      m_term_bit0 and can drive the board into self-test idle, so any tick-polling measurement of a
      firmware variable is suspect. A few-shot probe at 10MHz measured **[$798e]=0001**, not 0000,
      which if correct would put op42 on the >0 (bit7/settle) path rather than the "$FE forever" path
      and would change what this frontier even is.
    conf: "?"
  # RETIRED cont.420: op42-return0-transfer-phase and op42-completion-signal both rested on the
  # "(A1)-bit7 status word + [$7a36] settle" reading, which cont.413 disproved. Their one surviving
  # OBSERVATION - that node+$20 bit14 (transfer phase) is never entered and $9dd4/$974c run 0 times -
  # is kept in the completion.terminate_chain block. See superseded.
  # RESOLVED-AND-RETRACTED cont.420: "10MHz breaks INIT" was an INSTRUMENTATION ARTIFACT, not a
  # defect. Kept as a worked example because it cost most of a session and the mechanism is general.
  # See measurement_hazard below and the storager-measurement-discipline memory (failure class 7).
  - id: lua-sram-reads-corrupt-the-model   # cont.420 - a MEASUREMENT HAZARD, permanent caution
    state: >
      The model installs its OWN read tap across the whole SRAM range:
        cs.install_read_tap(0x4000, 0x7fff, "dma_snoop_r",
          [this](offs_t, u16&, u16 mem_mask){ if (m_dma_active) m_term_bit0 = (mem_mask==0x00ff)?1:0; });
      So ANY Lua read of storager RAM fires it and clobbers m_term_bit0, which is a live input to the
      F000 bit12 address comparator (term = 0x4000 | m_dma_term | m_term_bit0). A probe that polls a
      firmware variable each tick therefore corrupts the comparator; the $9C00 DMA-loopback self-test
      then reads wrong bit12 answers, exits with error $67 to $367A self-test idle, and the board
      never services another command. Observed as "stuck after cmd 0x87, spinning in $9Cxx".
    evidence: >
      Probes that poll SRAM every tick (readout.lua, final.lua, timeline2.lua) report the board stuck
      at cmd 0x87 - timeline2 over 0..40s recorded ONLY 00/03/87 in 1928 samples. Probes that read
      SRAM only a few times, after the self-test (pcwhere.lua, disambig.lua), reproducibly report
      cmd=95 st=0081 with the read live - 3 of 3, and at t=22, 30 AND 40. A probe using OPCODE taps
      only (loopback.lua) measured the self-test PASSING at 10MHz (body 49164, success 1, error 0).
      Removing a cpu.state["PC"] read changed nothing, isolating the SRAM read as the variable.
    consequences: >
      (1) The read DOES run at 10MHz; there is no 10MHz INIT defect. The earlier "10MHz 0-of-6 vs
      12.5MHz 4-of-4" is WITHDRAWN - the clock correlation was spurious (at 10MHz the self-test takes
      25% longer in wall-clock, so ~25% more probe reads land inside it and tip it over).
      (2) Any past conclusion drawn from a tick-polling SRAM probe is suspect and should be re-taken.
      (3) RULE: do not read $4000-$7FFF from Lua on a running model. Use opcode taps, model-side
      logerror, or read SRAM at most once at a known-safe point.
    FIXED: >
      cont.420: both snoop taps are now gated on a REAL BUS CYCLE - `machine().scheduler().
      currently_executing()` must be the storager's own CPU. A debugger/Lua access arrives from timer
      context with no device executing, so it is ignored and cannot mutate m_term_bit0 / m_last_bw.
      VERIFIED by the falsifiable prediction: readout.lua, the very probe that tick-polls SRAM and
      previously reached cmd 0x95 in 0 of 6 runs, now reaches it in 4 of 4 at 10MHz, and the read
      lands on cmd=95 st=0081 at t=6.418 - identical to the 12.5MHz trajectory. cmd 0x87 also now
      shows st=0081 (busy) where it previously read 0000.
      NOTE the same hazard class applies to any future tap the model installs over memory the
      firmware uses; gate them the same way.
    conf: V
  - id: transfer-phase-never-entered   # the surviving half of the two retired entries
    state: >
      With the DTACK hold all 8 sectors transfer and [$74b4] drains, but node+$20 bit14 (TRANSFER
      PHASE, set by $974c when [$7a70]!=0, [$7a70]=ffff at $9dd4) is never set and $9dd4/$974c run
      ZERO times, so the terminate chain [$7b40]->[$727e]->[$7968]->[$72d6] never fires. The DMAs
      physically complete but the firmware never makes the STATE TRANSITION. Note this is downstream
      of op42: $9492 (which reads bit14) runs only after op42 returns 0, and op42 is stuck on [$798e].
      So op42-gate-is-798e is the one to solve first; this may resolve with it.
    next: "solve op42-gate-is-798e first, then re-measure whether bit14 is still unset"
    conf: "?"
  - id: am2147-purpose   # cont.420 - reopened; FIRST behavioural evidence cont.437
    evidence_cont437: >
      The first data field of every run had NO destination: the firmware arms C800[0] only in RESPONSE
      to a data-done, so field 1 arrives before any arm and the model discarded it (host position 0
      then received stale SRAM on every read).  Detection and destination are INDEPENDENT events - the
      gate array deserialises the field as it passes the head, and the chunk address tells it where to
      put it - so a recovered field must survive the gap between them.  Holding the data and flushing
      it when the chunk arms is exactly what a bit buffer does, and it FAVOURS THE BUFFER READING over
      the program-store reading.  This is the first behavioural evidence bearing on this frontier.
    state: >
      The "serial bit buffer for ~one sector" reading is weak. (a) It is 4096 BITS = 512 bytes, not a
      sector for the ESDI path (1024B). (b) Recovered data is OBSERVED landing in the main SRAM chunk
      (C800[0], $4000-$43FF) and the capture record at the D800 address, so the data path already has
      its destination and does not need a second buffer. SPECULATION worth testing: the AM2147 is the
      gate array's PROGRAM store, not a data buffer - a 1-bit-wide 4096-entry memory is the natural
      shape for a position/event BITMAP or a bit-serial control store, and op18 "loads a program that
      does not run until the load completes" (doctrine 5) is exactly the act of filling it.
      Arithmetic that motivates it: $3066 masks the computed field position with $FFF - a 12-BIT
      position space, 0..4095 - and the AM2147 has exactly 4096 addressable locations. The one-bit
      selector each op18 push carries on the UDS/LDS choice would then be the DATA bit written.
      Supporting evidence already in hand: cont.408 showed the op18 push stream is byte-identical when
      the IOCB sector count changes 8->4, i.e. it describes the track FORMAT, not the transfer - which
      is what a position bitmap would be.
    next: >
      (1) count the distinct positions op18 can express and see whether they span 0..4095; (2) check
      whether the op18 descriptor values (17,1c,1d,1f,3f = 23,28,29,31,63) line up with the $4E2 field
      length list (44,6,32,4,6,5,4,20,29,8,30,3,6,161...) - note 29 appears in both; (3) if it is a
      bitmap, the model can stop snooping firmware RAM for field geometry and read it from the program.
    conf: "?"

self_test_idle:   # RESTORED cont.420 - decoded cont.243c, lost when board.yaml was rewritten at cont.404
  note: >
    This section existed only in the pre-cont.404 board.yaml, which was never committed, so the
    rewrite destroyed the only copy - and "A0CC" appears ZERO times in DESIGN.md. Re-derived from
    the ROM at cont.420. It matters because it is the firmware's own hard constraint on the PIT.
  entry: "$367A; every entry loads D0 with an error code ($F0/$67/$66/$65/$6B); runs MASKED (SR=$2700), drive-select nibble scan"
  timer_test:
    pc: "$A0CC"
    code: >
      D2 = $50000; loop { D0 = F000; if (D0 bit11 CLEAR) exit; D2--; } then
      if D2 > $4F600 -> error $6B (too FAST: fewer than $A00 = 2560 iterations elapsed)
      if D2 < $1000  -> error $6B (too SLOW: more than $4F000 = 323584 iterations elapsed)
      on error: andi #$fcff,[$79f6] -> E800, D0=$6B, clr [$71b2], bra $367A
    meaning: >
      The firmware CERTIFIES the PIT OUT half-period on F000 bit11 against a window. The loop body is
      ~48 cycles, so at 10MHz the accepted half-period is roughly 12ms .. 1.55s. pit1 ctr0 (count
      0xFF00, mode 3, 2.5MHz) gives a 26.1ms period / 13.05ms half-period - inside the window, but
      not by much at the fast end.
    consequence: >
      F000 bit11 must be fed by the ~26ms SYSTEM TICK counter (pit1 ctr0), NOT by ctr2. The cont.414
      model_gap note suggesting bit11 is "probably the wrong counter" is contradicted by this test -
      had this section not been lost, that note would not have been written.
  per_rom_set:   # cont.420 - the constants differ BETWEEN ROM SETS, and v180 pins the clocks
    measured: >
      Interleaving all three dumped ROM sets and locating the test by its signature (3038 f000 /
      0800 000b) rather than by address:
        v260 (StoragerII) test@$A0D2 : window 2560 .. 323584 iterations  (loose - lower bound only)
        sgic (05808423A)  test@$A0AA : window 2560 .. 323584 iterations  (loose)
        v180              test@$95AE : window 2560 ..   2816 iterations  (TIGHT, +-5%)
    what_it_pins: >
      The v180 firmware CERTIFIES the CPU:PIT ratio to ~10%. Loop = 48 cycles (12+10+8+8+10).
      At 10MHz that is 4.8us/iteration, and pit1 ctr0 (0xFF00, mode 3, 2.5MHz -> 13.056ms half-period)
      gives 2720 iterations - almost exactly the centre of 2560..2816 (midpoint 2688).
      At 12.5MHz it is 3.84us/iteration -> 3400 iterations, OUTSIDE the window: the v180 board would
      reject itself with error $6B. So the v180 ROM independently pins BOTH constants - CPU 10MHz and
      PIT ctr0 2.5MHz - and independently refutes the old 50MHz/4 = 12.5MHz reading.
    verified: >
      Empirically: `-slot1 storager,bios=v180` (switch confirmed loaded - [$95AE]=3038, [$A0D2]=ffff)
      passes self-test at 10MHz and proceeds to INIT. Also retires the cont.420 worry that v260's
      6%-margin implied a wrong PIT rate: v260 merely has a loose bound; v180 shows the design point.
    conf: V
  conf: V

superseded:   # readings the log overturned; recorded so they are not re-introduced
  - {claim: "op42 DONE needs a status word (A1)-bit7 plus the settle flag [$7a36]", corrected_by: "cont.413 - op42's master control is [$798e]; (A1) is node+$18, an ERROR field, not a status word, and [$7a36] was verified firing correctly. Two open_frontier entries (op42-return0-transfer-phase, op42-completion-signal) rested on this and were retired at cont.420."}
  - {claim: "PIT ctr2 is the LAST GATE on the read - op42 waits for it (cont.414)", corrected_by: "cont.420 - inverted. $6CC2 writes ctr2's CONTROL byte on op42's DONE return path ($6CDA clr.l D0 = DONE), not while waiting; and the COUNT load at $6CD2 is gated on [$796e]==$FFF0, which is structurally FALSE for the read (node+$12=$40 -> &3 != 3 -> the $1134 leg leaves [$796e]=0). On the read path ctr2 therefore receives a control word but never a count, so wiring timer2_out() cannot open a gate that was never armed."}
  - {claim: "the CPU runs at 50MHz/4 = 12.5MHz", corrected_by: "cont.420 - 10 MHz, CONFIRMED by the fitted part: the Storager II carries an MC68000-10 and the v180/SGI revisions an MC68000L10, both 10 MHz devices; storagerii.webp shows a 32/10 MHz can and a 50 MHz can. 12.5MHz is 4% over a P12 and 25% over a -10. Timing analysis done before this (cont.409a) is calibrated 25% fast."}
  - {claim: "the AM2147-55 is the gate array's serial bit buffer holding ~one sector", corrected_by: "cont.420 - it is 4096 bits = 512 bytes (half a 1024B ESDI sector), and recovered data is observed landing in the MAIN SRAM chunk, so a second sector buffer is redundant. Purpose reopened - see open_frontier am2147-purpose."}
  - {claim: "the MCM6164C45-vs-MB8464A SRAM discrepancy is a documentation error", corrected_by: "cont.420 (Dave) - BOTH types genuinely occur, on different board revisions."}
  - {claim: "the CPU can address host memory directly through the $010000-$FEFFFF Multibus window", corrected_by: "cont.420 MEASURED - zero CPU reads and zero CPU writes into that range across a full boot that reached cmd 0x95, with a live control (324 gate-array writes seen in the same run). The window is vestigial; every host access goes through the gate array's bus-master path. Consistent with A1-A15-only decode."}
  - {claim: "op18 loads the E000 block from a class-selected ROM template", corrected_by: "cont.406 - the param block is in RAM at [$7938]=$6E84, immediately after the UIB at $6E60. op18's program is BUILT PER-UNIT FROM THE UIB, so the field program is a function of the geometry the CPUAP supplied."}
  - {claim: "C800 is a 16-entry field-boundary file paired 1:1 with the E000 block", corrected_by: "cont.406 - op18 pushes 16 descriptors through only THREE offsets, writing the same cell repeatedly (cell 0 six times). It is a set of write PORTS into a sequencer, not storage."}
  - {claim: "the third byte of each op18 triple indexes a table at $6000", corrected_by: "cont.406 - it is only ever 0 or 1. $6000 is zeroed SRAM (the $073A boot clear) and the read data is discarded; the payload is WHICH BYTE STROBE is asserted."}
  - {claim: "$7BA8 (setup) arms the chunk C800[0]=[$741e]; $8018 (done) advances the buffer", corrected_by: "cont.406 measurement - exactly backwards. $7BA8 ADVANCES [$741e]; $8018 WRITES C800[0]."}
  - {claim: "the model stages each sector to 0x4000 + index*sector_len", corrected_by: "cont.406 - that is a record ahead of the firmware's pointer; stage into the COMMANDED chunk C800[0]<<1 or the last sector is never transferred."}
  - {claim: "every local->host DMA byte-swaps each 16-bit word", corrected_by: "cont.406 - true for control blocks, WRONG for data fields (host reads OV1LISIN0X instead of VOL1SINIX0; the buffer base is odd)."}
  - {claim: "the model delivers only 3 interrupts per sector so the alternator parity must net-flip", corrected_by: "cont.406 opcode taps - the firmware enters FOUR handlers per sector (verify, verify, setup, done) and parity does return to start. The objection is withdrawn."}
  - {claim: "op18's eight port-$3F pushes are the eight commanded sectors", corrected_by: "cont.408 experiment - forcing the IOCB count 8->4 leaves the descriptor stream BYTE-IDENTICAL (still 8 pushes) while the records/DMAs drop to 4. op18's program describes the track FORMAT (built from the UIB), not the transfer length."}
  - {claim: "the 8/8 transfers depend on the first record being delivered before op18's rts", corrected_by: "cont.408 - retracted. Drawn from a single bisect run; the follow-up A/B configurations were in a runaway retry loop (65799 program loads vs 9), so the comparison was void. The cause of the 0-DMA runs under physical timing is NOT established."}
  - {claim: "VGC7219 fronts a 74LS1811 ENDEC + 74LS1812 SERDES", corrected_by: "cont.405 (board photo) - board has 74LS1801/1802 ENDEC (data separation ONLY); the VGC7219 itself does SERDES/CRC/DMA (AM2147 = its bit buffer). No separate SERDES part."}
  - {claim: "cmd 0x95 is NEVER DISPATCHED (intake $0BF2/$0D54/$0DD6 drops it)", corrected_by: "cont.353 clean rebuild - with the HLE short-circuit removed the read DOES dispatch, arm (op18), capture, and (cont.405) transfer all 8 sectors. That root was an HLE-era artifact."}
  - {claim: "the read completes via a bulk-descriptor DESCGO stream / NATLAYOUT / flux->host short-circuit (s_desc)", corrected_by: "cont.353 - all HLE; retired. The firmware commands per-sector SRAM->host DMAs it bus-masters itself."}
  - {claim: "the 2/8-transfer stall is a descriptor-drain cap / capture-rate race", corrected_by: "cont.405 - it was the DMA not holding the CPU (DTACK); with the hold all 8 launch."}
  - {claim: "0xc0 in the ledger = 'staked / done'", corrected_by: "cont.405 - 0xc0 is the ledger IDLE/resting value (all-c0 before capture); staking is the transient f0->consumed cycle."}
  - {claim: "the read data buffer is a reused fixed $4000 (1-sector) buffer", corrected_by: "cont.405 - once all 8 transfers fire, D000 advances $4000/$4080/...; the firmware builds a LINEAR 1024-byte buffer. The fixed-$4000 reading came from only 2 transfers firing."}
  - {claim: "PIT ctr1 = DMA transfer counter", corrected_by: "cont.156-158 - ctr1 = seek-settle one-shot; the transfer count is [$7956] (firmware)."}
  - {claim: "E802 bit15 is the per-command arm signal", corrected_by: "cont.191 - mark-circular; the E000 bit11 engagement write is the arm."}
  - {claim: "doorbell auto-fetch is 0x1C bytes", corrected_by: "cont.209 - 0x18 bytes (12 words)."}
  - {claim: "IOPB count is 512-byte blocks (label read = 32 sectors / 2 tracks)", corrected_by: "cont.260 (media-verified) - count is NATIVE SECTORS; the label read is 8 sectors on one track (head1 is unformatted 0xe5)."}

program_data_split:   # cont.417 - a DEDUCTION, not an observed board fact
  claim: >
    In $4000-$7FFF, INSTRUCTION FETCHES see ROM while DATA accesses see RAM - i.e. the board separates
    program and data space, presumably by decoding the 68000's FC0-FC2 function-code lines.
  why_we_think_so: >
    (1) RAM is definitely $4000-$7FFF (16KB, matching the 2x MB8464A): the reset SSP is $7D96 and every
    firmware variable lives there and reads back what was written.
    (2) Code demonstrably EXECUTES in that range - measured PCs at $683E, $6854, $6BC2, $6C8E, $7F10
    correspond exactly to the instructions the ROM image holds there (the [$798e] writes traced at
    $683E/$6854 are `move.w #$ffff,$798e` / `move.w #$1,$798e` in the ROM).
    (3) There is NO ROM->RAM code relocation anywhere in the firmware. Every block copy in the ROM was
    enumerated: 24-byte IOPB moves ($C18/$1BB2), op18's 16-word E000 block ($310E/$3126), $A374's
    24-word descriptor build, and ONE 8KB pair at $9D34/$9D46 which is the RAM TEST's save/restore
    (its walking patterns 5151/8080/4b4b over $74xx/$79xx appear in every trace).
    So the code cannot have been copied to RAM; it must be fetched from ROM in place.
  caveats: >
    Dave has never seen a 68000 board do this, which is significant evidence against. The weakest link
    in (2) is that those PCs come from pcbase() inside write handlers, and pcbase() was proven
    unreliable this session (it under-reported 16 of 144 op18 pushes) - though the PC/instruction
    correspondence is too exact for coincidence. An alternative NOT ruled out from the ROM image alone
    is a BANK/DECODE LATCH selecting ROM or RAM in that window; none has been identified, but E800/E802
    still have undecoded bits.
  decisive_evidence: >
    EXECUTION ABOVE $8000.  Measured PCs at $833C (the bclr #0,$7a30 kick), $8A88 (the [$741c] clear),
    $992E (the ID-match accept), $9D34/$9D46 (the RAM test) and $A374 (the descriptor build) each hold,
    in the ROM image, exactly the instruction that produced the observed effect.  In the DATA space
    $8000-$8007 is the PIT pair and $C000+ is the gate array - so execution at those addresses is
    IMPOSSIBLE unless instruction fetches see ROM where data cycles see I/O.  This is positive evidence
    from live traces, not an inference from absence, and no boot overlay, bank latch or code-in-RAM
    explanation survives it.
  corroboration: >
    Every ROM constant actually used sits BELOW $4000 - the $192 op-jump table, $63E op-family, $22E
    per-unit status masks - and reads correctly straight from the ROM image.  Every structure at/above
    $4000 is RAM-built at runtime: the $7696 chunk table, the $6E84 op18 param block, the ledger $7654,
    the nodes.  That is the discipline a split-I&D machine forces: code high, constants low.
    Mechanism (Dave, cont.417): FC1 alone discriminates program from data; one line into the decode PAL
    selects "ROM only" vs "RAM + I/O".  Motivation: the board decodes only A1-A15 (a 24-bit CPU wired as
    a 64KB machine to save decode logic and address buffers), and one FC line buys the space back.
    Lineage is the PDP-11's split I&D; the everyday analogues are the 8051's /PSEN vs /RD and the Z80's
    /M1.  Rare on a 68000 but explicitly supported by Motorola.
  consequence: >
    CAUTION (Dave): because only A1-A15 are decoded, ANY address above 64K seen on the bus must be
    examined very carefully - the Storager may be using those upper bits for completely unrelated
    purposes rather than as an address.  Two confirmed instances of exactly that idiom already exist:
    the C000 host-address counter takes host bits 23-16 on address lines A1-A8, and op18's $6000 push
    strobe carries its selector bit on the UDS/LDS choice.  The model's Multibus window at
    $010000-$FEFFFF should be re-examined against this - if the board truly decodes only A1-A15, the
    CPU cannot reach host memory by direct addressing at all, and every host access must go through the
    gate array's bus-master path.
  model: "storager.cpp: mem_map (RAM wins $4000-$7FFF for data) + opcodes_map (ROM everywhere). Predates this session; was previously only an unexplained source comment."
  conf: "V"

command_class_bit14:   # cont.422 - bit14 is a HANDLER-FAMILY tag, not a per-request mode
  finding: >
    node/UIB+$20 bit14 selects op54's watch template ($A362: clear=A $66A, set=B $6A6), op58's
    $73B6/$73BC seeds, $948C's second op4A, and $94B6/$94CA's [$727e] handling.  It was suspected of
    being a host-supplied "single-shot vs continuation" mode whose value disagreed with the measured
    zero remainder.  It is not.
  evidence: >
    UIB+$20 sits at $6E80.  The UIB's host DMA is 0x20 bytes ($6E60-$6E7F), so +$20 is OUTSIDE the
    transferred block and cannot be host-written.  Its value $8C27 is exactly the flags word of cmd
    $95's entry in the ROM dispatch table at $92 (4-byte entries {handler, flags}, index cmd-$70).
    Across all 29 populated entries bit14 correlates 1:1 with the HANDLER: $5FC0 (cmds 71 81 83 93 94
    95 97 99) is always 0; $6102 (72 82 96), $6208 (84 85 8c 90 9f), $3900 (8d) always 1.
  consequence: >
    There is no configuration in which cmd 0x95 carries bit14 set - that would be a different handler.
    Template A is definitionally what the read gets, and the zero transfer remainder ([$7abe] cleared
    by op58's $738C on a single-track request) is correct arithmetic.  Both halves are consistent; the
    apparent contradiction was a mis-reading of what bit14 selects.  Do not go looking for a bit14
    anomaly.
  conf: "V"

ladder_builders:   # cont.422 - three command architectures, one per handler family
  finding: >
    Each command handler writes its own micro-op ladder and its own watch table.  They differ in
    whether the $7A30 kick is armed and whether $72D8 is seeded.
  detail: >
    $5FC0 (cmd 0x95 read): ladder 24,28,56,58,[1A],18,54,4A,42,36,0.  $6042 ARMS the kick; op54 seeds
    $72D8 = $7286 from template A; rec0 callback $7964.
    $3736 (cmd $88): ladder 24,28,56,58,[1A],18,4A,32,42,36,0.  $37A0 CLEARS the kick, $37A4 clears
    $72D8, rec0 callback $7964 written inline - no op54.
    $3900 (cmd $8D): ladder [24],28,56,58,[1A],18,48,32,42,36,0.  $3976 clears $72D8, rec0 callback
    $836C written inline - the self-driving architecture ($836C -> $8382 -> $8398 -> $842E -> $843E ->
    $8460 phase 0x0C, with $840A un-banking rec1).  op32 = $4EC2 is a host-status handshake, not a
    completion driver.
  consequence: >
    op54's $72D8 seed is INTENDED for the read; it is not a stray re-seed to be undone.  Only cmd 0x95's
    family is kick-dependent.
  conf: "V"

dbc_two_routines:   # cont.422 - $3DBC forks on the CALLER's interrupt mask
  finding: >
    $3DC0 captures the caller's SR into D2; $3E08 btst #$a,D2 forks on IPM bit10.  SET -> $3E0E
    un-banks record $7286 (arm).  CLEAR -> $3E1C clears $72D8/$72DA, then $3E24 requires [$72d6]==0
    and $3E30 writes node phase 0x0C (terminate).
  callers: >
    $70F4 (drain tail, entered at SR $2000 via $6F40) -> bit10 CLEAR -> terminates.
    $7106 -> $710C sets SR $2400 before bra $6F44, so a drain entered THAT way arms instead.
    $732A (SR $2400 at $7326) and $8344 (SR $2400 at $8338) -> arm.
    The watch pump's jsr (A1) at $1676 -> mainline -> terminates.
  consequence: >
    Interrupt-context calls ARM, mainline calls TERMINATE.  The $7A30 kick can never clear $72D8; that
    is the design, not a defect.  The same call site ($70F4) behaves oppositely depending on how the
    drain was entered.
  conf: "V"

descriptor_queue:   # cont.422 - [$74b4] has a second source; the launch is one drain away
  finding: >
    [$74b4]/[$74b6] is a linked descriptor queue enqueued by the PER-RECORD ISR at $81F8/$81FC/$820A,
    independent of the drain.  The fork at $8154 is the SAME word tested at $8116 for the ledger arm,
    so the c0 path (which every commanded record takes) is exactly the path that enqueues.
  measured: >
    [$74b4] = $74C4 from the first record (7.9726) and is never consumed for the rest of the run.
  launch_route: >
    $70EA tst.w $74b4 / $70F4 bsr $3dbc -> $3DE0 non-empty -> $3E50 -> $3E6A -> $4062 -> $40BE ->
    $40C2 bit11 (set in $8C27) -> $4122 -> $414C installs [$743a]=$7442 and arms pit0 ctr1.
    $731E/$732A and the $7208/$721A tail are the same shape.
  consequence: >
    The drain ran once at 7.9602, twelve milliseconds BEFORE the descriptor it needs existed.  Any
    later drain invocation would launch the transfer outright.
  conf: "V"

bootstrap_deadlock:   # cont.422 - the whole gap in one condition
  chain: >
    [$741c] is set ONLY when the firmware REJECTS a record ($7D4A -> $7D5C) and CLEARED when it accepts
    one ($7CA4).  [$741c] is the sole gate (with [$796a], measured constant 1) on $82B2, which is the
    only reachable setter of [$7968].  [$7968] flips [$742C] at $7E8E, which selects $8128 (drainable
    index) over $8120 (c0).  op4A samples [$7968] at $6EDC: zero -> arm and immediately disarm [$7b10]
    ($6ED6/$6F3A) and drain inline against an empty ledger; non-zero -> leave [$7b10] armed for the
    ISR.  [$7b10] has ONE setter ($6ED6) and three testers ($7D68/$7D94 in the record ISR, $8320,
    $8352), all of which call $7106.
  measured: >
    [$7968] is 0 at op4A on every path.  Whole-boot trace: the only writes before the read are the
    $9C00 self-test's own patterns ($9CEA/$9D14/$9D4A), cleared by 0.2s; cmd $87 leaves it 0.
    op18 -> op54 -> op4A is uninterrupted (op18's four exits $30A2/$3114/$318E/$31EA are all clr.l D0,
    so the walker never waits; op54 is single-exit $A38E/$A390), giving a 0.4-0.5 ms window that cannot
    hold the three interrupt services (IRQ6 -> IRQ5 setup -> IRQ5 done -> $82B2) the bootstrap needs.
  eliminated: >
    - records before op18: BREAKS the read (7 records not 16, $7956 decremented spuriously, command
      aborts cmd=00).  op18 is genuinely the gate.
    - rotational start + immediate first record: both implemented and correct, neither sufficient.
    - a prior command leaving [$7968] set: measured 0 across the whole boot; CPUAP is faithful.
    - injecting IRQ4: [$743a]=$748A until $414C runs, so it dispatches the idle descriptor's callback.
    - node+$18 (rec2/$9188): that is the ERROR teardown ($1206 epilogue); a callback returning non-zero
      makes the pump post phase 0x0C at $169E with the code in the error field.
    - $92B4/$9312's f0 stake: gated on [$742C]!=0 (our state, opposite arm from $8128) but f0 is
      NEGATIVE, so the drain's $6FDC bge rejects it - not drainable.
    - rec5/$9398 and the second op4A: correctly banked, all four un-banks ($70B4, $721A, $8276, $799A)
      require [$7958]!=0 and the remainder is legitimately 0.
    - pit1 ctr2: armed mode-5 by op28 ($684C) and op42 ($6CC2) but the COUNT is never loaded, because
      [$796e]=0 for this command ($1042: UIB+$12 & 3 != 3).  Parked by the firmware.
    - host DMA: 1839 E800 writes during cmd 0x95, ZERO with bit12 set.  No transfer is ever requested,
      so no IRQ4 exists during the data phase (9 in the whole run, all before 6.414).
  frontier: >
    The per-record re-invoker EXISTS and is disabled: $7D68 tests [$7b10] and $7D94 calls $7106.  One
    surviving [$7b10] at any record after 7.9726 completes the command.  What the gate array must
    present so that op4A samples [$7968] non-zero is the open question.
  conf: "V"

record_delivery:   # cont.422b - what the gate-array trace settled about the per-record stimulus
  cadence: >
    Measured from docs/storager-lle/ga-trace-8sector.txt: one IRQ6 (ID address mark) plus two IRQ5
    (data field armed, data field done) per record, records spaced a uniform 12.80-12.84 ms - one
    sector period at 16 sectors on a 200 ms revolution.  The IRQ5 #1/#2 split in the trace is the
    FIRMWARE's alternator fork ($7950 -> $7BA8 vs $8018), not a model phase: 142 vs 16 means the
    alternator does not settle until the first data-done, not that the model emitted 142 of one kind.
  index_verified: >
    F000 bit4 asserts correctly - sampled directly off the drive at 200 us, a 2.00 ms pulse every
    200.0 ms, 11 pulses in the window, motor on.  The firmware's 16 F000 reads are POINT samples
    covering ~16% of a revolution (16 x 2 ms / 200 ms), so their never showing bit4 is expected and
    proves nothing.  Do not re-open this as an INDEX defect.
  status_polarity: >
    F000 bit13 (track 0) is ACTIVE LOW - always clear MEANS the head is at track 0, matching the single
    E804 position latch and the absence of any stepping.  bit12 (DMA address match) correctly follows
    the absent host DMA.  Neither is a defect.
  host_dma_path: >
    E800 bit12 is exercised and decoded: exactly two writes have it set, both inside the IOCB-fetch
    IRQ4 at 6.4129, each paired with a D000/C000 load, and a real IRQ4 follows.  Its absence across
    1839 writes in the data phase is therefore a firmware-state result, not a modelling gap.
  d800: "constant $3ED6 = $7DAC across all 300 writes - the firmware commands the same capture buffer every record; the model's fallback never engages."
  open_chunk_overrun: >
    C800+000 advances by $40 words (128 bytes, one FM sector) per record, 17 distinct values for 16
    data-done records, covering 2048 bytes against a 1024-byte 8-sector command.  Records 9-16 land at
    $4400-$47FF, outside the commanded buffer, and [$7956] has already drained to 0 by record 8 - so
    the per-record path is not gated on the commanded count.  PER_ADDRESS_MARK's justification ("the
    firmware stops re-arming when it is done") is not what happens.  Note the alternative was tested:
    PER_ADDRESS_MARK=false gives the same end state but removes the rejected out-of-window records that
    are the ONLY source of [$741c].  There is also a double-advance at 8.06088/8.06133 (45 us apart
    against a 1.28 ms step) - one record allocating two chunks, which is where the 17th value comes
    from, and probably the same re-entrancy class as the deadline bug below.
  conf: "V"

model_regressions_found:   # cont.422b - two defects introduced by this session's own changes
  deadline_reset: >
    "Immediate first record" set m_next_rec = machine().time() unconditionally in start_field_program.
    Every per-record ISR re-issues the program's first command (E000 <= $0a6d, bit11 set), which
    re-enters that routine - so the rotational deadline was reset to NOW on every record.  Measured
    effect: the phase machine free-ran at ~200 us per phase instead of 1.875/8.75 ms, producing an
    IRQ6/IRQ5 runaway at 64 us with no data-done after the last real record.  FIXED: the reset is now
    guarded by first_arm.  Spacing is a flat 12.84 ms for the whole run.
  instrument_gate: >
    gatrace.lua gated recording on a PERIODIC poll of the command byte, which opened ~4.5 ms after the
    IOCB was written and swallowed op24's dispatch entirely - reading as a firmware anomaly ("op24 is
    absent from the executed ladder") when it was a sampling lag.  FIXED: an exact write tap on $71F0.
    The executed ladder is 24 28 56 58 18 54 4A 42, matching the builder ($5FE6..); op1A is conditional
    and op36/op00 never dispatch because op42 never returns 0.
  conf: "V"

end_marker_experiments:   # cont.423 - the $AA end-of-transfer marker, three forms, all measured
  the_fork: >
    $7E8E forks on [$7968] and the two arms consult the $AA end marker DIFFERENTLY.  They are
    ALTERNATIVES, not a sequence:
      [$7968]==0 -> $7EB2: accept, $7EBE decrements the remaining count, and the marker is tested
                    ONCE at $7ED0, one instruction after the count reaches zero.
      [$7968]!=0 -> $7E90: the marker is tested at $7E9A on EVERY record, no count precondition.
    Measured cells: $7ED0 reads [9] ($765D) at the remain->0 edge; $7E9A reads [10], [11], [12] on
    successive records - D0 advances by one per record because every cell past the window already
    holds $fe, so the scan halts one further along each time.  There is no single fixed cell.
  addressing_rule: >
    Within ONE record the firmware TESTS then STAKES: $7E9A reads S+1, then $8120/$8128 writes S.
    So the cell the NEXT record will test is LAST STAKE + 2 (Dave's "immediately after the last
    stake" was one cell short for exactly this reason).  For the $7ED0 arm the target is instead
    FIRST STAKE + COUNT.  Both addresses are derivable from bus-visible writes plus the op18
    program's own port-$3F push count - no IOCB or firmware-cell read.
  trigger: >
    $82B8 bset #0,$7ac2 - written once, read NOWHERE in the ROM - fires one instruction after $82B2
    sets [$7968].  It is the firmware signalling hardware that it has bootstrapped, and it is the
    only such signal available.  Measured 8.9 ms AFTER the remain->0 edge, so it can arm the $7E9A
    arm but can never serve $7ED0.
  results: >
    v1 (unconditional next=$AA, Dave): broke mid-read - $AA planted in front of still-wanted $ff
    walls off the want-scan.
    v2 (next != $ff guard, Dave): 8 DMAs restored, fires once, but on the OVERRUN stake - 8.8 ms
    after the terminate fork has already taken $7F14.
    v3 (first stake + count, deposited from device context): planted at [765D] 81 ms before the
    edge and $7ED0 READ IT - but with the address mark still free-running the read ran to 114
    records.
    Q3c (sliding, last stake + 2, armed by the strobe): $7E9A read $AA at [765F] and took $7ED8 -
    the FIRST time the firmware has ever taken a terminate branch.  But $7ED8 is only
    "move.w #$0,$741c / bra $7F1A": it suppresses the re-arm FLAG and does not stop the ISR issuing
    the E802 bit11 capture re-arm, so records kept arriving (116 vs 16), remain ran negative, and
    $7C92 cleared [$7968] again.  Not a completion.
  doctrine: >
    Deposits must be made from the DEVICE's context, never from inside a CPU write tap: in a tap
    currently_executing() is the local CPU, so the model's own $4000-$7FFF snoop sees the access and
    clobbers m_term_bit0 (peek) or m_last_bw (write), both live inputs to the F000 bit12 comparator.
    From device context it is a bus-master cycle and the snoop correctly ignores it.
  conf: "V"

counted_stop_open:   # cont.423 - the address-mark disarm, and an unexplained truncation
  question: >
    Does the last sector's DATA phase disarm the address-mark interrupt in the gate array?  That is
    the physically right reading of a counted op18 program, and VAR_COUNTED_STOP already implements
    it (m_data_done_n >= m_sec_count && m_sec_count > 0, at the top of advance_read).
  measured: >
    VAR_COUNTED_STOP ALONE truncates the read to 4 records, not 8 - with the end marker disabled, so
    the truncation is the variant itself.  This also casts doubt on the earlier reading that v1's
    4-DMA result was caused by the $AA; the marker may have been innocent there.
  hypothesis_untested: >
    The check sits at the TOP of advance_read, which runs on every pump tick AND every E802 re-arm,
    so it may trip on a partially-advanced count rather than only after a completed data phase.
    NOT confirmed - needs m_data_done_n / m_sec_count logged at each entry.
  why_it_matters: >
    With the address mark disarmed no record is ever rejected, so [$7968] stays 0, the handler takes
    the $7EB2 arm, and the marker is consulted at $7ED0 - the arm the first-stake+count rule was
    built for, which plants correctly 81 ms ahead of the edge.  That combination is the one worth
    testing once the truncation is understood.
  conf: "P"

model_traps:   # cont.423 - two standing hazards that have each bitten more than once
  reentrant_start_field_program: >
    start_field_program() is RE-ENTERED on every record: each ISR re-issues the program's first
    command (E000 <= $0a6d, bit11 set).  Anything stateful reset there is reset per record, not per
    command.  This has caused two defects: m_next_rec being reset every record (free-ran the phase
    machine to a 64 us IRQ6/IRQ5 runaway) and the end-marker's done-flag being cleared every record
    (planted a fresh marker one cell along until remain went negative).  Per-command state belongs
    in the "if (!m_read_active && cmd == 0x95)" block, never above it.
  sec_index_is_a_position: >
    Since the rotational-start change m_sec_index is the head's position on the track, NOT a tally of
    sectors delivered.  Any "have we finished?" test must use m_data_done_n.  Testing m_sec_index
    against m_sec_count stops the read before the first record whenever the rotational phase starts
    above the commanded count.
  conf: "V"

alternator_reclear:   # cont.424 - why the counted disarm truncates, and it is not the disarm
  finding: >
    The IRQ5/IRQ6 stubs fork on [$7950] bit0 (bchg, so the OLD bit decides), but the handlers
    RE-CLEAR it before returning: $8A3E and $88D6 both write $7950 = 0.  $88D6 runs at the end of
    every handler, so the alternator never survives to present old=1 on a following IRQ5.  Every
    IRQ5 is therefore seen as a FIRST one and routes to $7BA8 (data field armed); the second never
    reaches $8018 (data field done).
  measured: >
    With VAR_COUNTED_STOP the model delivered exactly the right stimulus for 8 sectors - 8 IRQ6 and
    16 IRQ5 - and the firmware routed them 12 setup / 4 done instead of 8/8.  Sequence per record:
    IRQ6 -> stub toggles 0->1 -> verify -> $8A3E clears -> $88D6 clears -> IRQ5 toggles 0->1, old=0
    -> SETUP -> $88D6 clears -> next IRQ5 toggles 0->1, old=0 -> SETUP again.
    The baseline shows the same defect masked: 194 setup / 16 done, reaching 16 only because records
    keep arriving until enough dones accumulate.
  consequence: >
    The model's premise - "IRQ5 #1 arms the data field, IRQ5 #2 completes it" - is NOT what the
    firmware implements.  The interrupt alone does not distinguish arm from complete; the firmware
    re-clears the discriminator inside the handler, so something else must carry that distinction.
    This is the blocker under the counted disarm and under the $AA end marker, one level below where
    both were being investigated.  Settle it before either.
  not_the_disarm: >
    VAR_COUNTED_STOP itself is correct: it fires exactly at done == count == 8 ("GA disarm: done=8
    count=8 idx=4 phase=0").  The read truncates to 4 firmware-processed sectors only because of the
    routing above.  Do not treat the truncation as evidence against the counted disarm.
  conf: "V"

source_cleanup:   # cont.424
  what: >
    storager.cpp 1955 -> 1382 lines.  Removed 494 lines of diagnostic address-space taps from
    device_reset, the orphaned TEMP members they fed, the ga_log helper and its call sites, and the
    TEMPPROG/UIB/VECTOR/CHUNKTBL, TRACK, TEMPSTAGE and TEMPDMA dumps.  logerror 68 -> 9; taps 100 ->
    2 (only the functional dma_snoop pair, which feeds m_term_bit0 / m_last_bw for the F000 bit12
    comparator and must never be removed).  The one line kept from the TEMPPROG block is the port-$3F
    push count, which is how the gate array knows the commanded sector count without reading the IOCB.
  verified: >
    Baseline behaviour identical after the cut: 16 records, 16 data-done, [$7968]=1, st=0081.
  note: >
    The equivalent coverage now lives in the Lua instruments under docs/storager-lle (timeline.lua,
    gatrace.lua, blocks.lua, dmareq.lua) - nothing needs compiling into the device to observe it.
  conf: "V"

converged_read:   # cont.425 - cadence, disarm and end marker all correct simultaneously
  the_wrong_assumption: >
    The counted disarm was counting DATA FIELDS DELIVERED.  That is not the number of sectors read.
    The gate array has no header comparator - it raises every address mark and the FIRMWARE decides
    ($7C7A / $7D34).  A rejected record is torn down at $7DA2 -> $88AC, which clears the capture
    re-arm (E802 bit11) AND the $7950 alternator; an accepted one is staked $c0 into the ledger.
    With the rotational start the first records are sectors outside the want-list, so delivered
    exceeded accepted (12 vs 8) and the disarm fired four sectors early.  That, not the $AA slot,
    was what broke the cadence.
  disarm_rule: >
    Count the ACCEPTED sectors - the $c0 stakes, which are bus-visible writes - and disarm the
    address mark when that reaches the op18 program's own port-$3F push count.  Measured:
    "GA disarm: accepted=8 delivered=12 count=8 t=8.11203", with 8 records / 8 data-done / 8 stakes
    and 16 setup, the 1:2 ratio expected once every accepted sector completes.  Compare 4/12 with the
    delivered-count rule and 16/194 free-running.  Genuine read failures remain the firmware's to
    retry ([$79a4]) - the gate array simply stops after the last VALID sector.
  marker_rule: >
    The terminate fork tests ONE cell, one instruction after the last accepted sector takes the
    remaining count to zero ($7EBE -> $7EC2 not taken -> $7ED0).  Within a record the firmware TESTS
    S+1 then STAKES S, so the cell that test will read is (stake address + 2).  The PENULTIMATE
    accepted stake is the last chance to write it - measured 8.0992 against an edge at 8.1037, a
    4.4 ms margin.  Arming on any earlier stake plants in front of a still-wanted $ff and walls off
    the want-scan; arming on the last stake is 8.8 ms too late.
  inputs_are_the_gate_arrays_own: >
    Cell = the stake write address seen on the local bus, + 2.  Length = the port-$3F push count of
    the program the firmware loaded into the gate array.  Neither is an IOCB or firmware-cell read.
    The deposit is made from the device's own context so it is a bus-master cycle and the model's
    $4000-$7FFF snoop correctly ignores it.
  measured: >
    "Q3D $AA -> [765d] (bus-master) remain=0001" then
    "$7ED0: cell [9] @765d = aa *** IS $AA - would terminate ***".  Reproduces run to run.
  still_open: >
    $7ED8 is only "move.w #$0,$741c / bra $7F1A" - it stops the re-arm but is not a completion, so
    st stays 0081 and [$72d6] is not torn down.  And because the terminate branch is taken, $82B2
    never runs, so [$7968] ends 0 rather than 1: the marker and the bootstrap still contend for
    [$741c].  That contention is now visible on a HEALTHY 8-sector read rather than a degenerate one.
  conf: "V"
